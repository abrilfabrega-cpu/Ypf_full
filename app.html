<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><title>YPF TRES SOLES FULL</title><style>html,body,#app{width:100%;height:100%;margin:0;border:0;display:block}</style></head>
<body><iframe id="app" src="/core-app.html?v=20261027-2149"></iframe><script>
const frame=document.getElementById('app');
function expiry(){location.href='/expiry.html?v=20261027-2149'}
function inject(){try{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w||!w.me)return;if(w.me.role==='manager'){const nav=d.querySelector('#head .nav');if(nav&&!d.getElementById('expiryAdminTop')){nav.style.gridTemplateColumns='repeat(2,1fr)';const b=d.createElement('button');b.id='expiryAdminTop';b.className='sec';b.textContent='Vencimientos';b.onclick=expiry;nav.appendChild(b)}}else{const card=d.querySelector('#work .card');if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#1979a8;margin-bottom:6px">📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button type="button" style="margin:0">Abrir vencimientos</button>';box.querySelector('button').onclick=expiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error(e)}}
frame.addEventListener('load',()=>setTimeout(inject,500));setInterval(inject,700);
</script></body></html>
