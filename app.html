<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#62bde9">
<link rel="manifest" href="manifest.webmanifest">
<title>YPF TRES SOLES FULL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:white;padding:27px 20px 23px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{font-size:13px;padding:12px 6px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.ghost{background:#f7fcff;color:#1979a8;border:1px solid #c9eafa}.hide{display:none}.muted{font-size:13px;color:#6c8794}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}input{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px;background:#fff}h2{margin:7px 0 12px}</style>
</head><body>
<header class="top"><b>YPF TRES SOLES FULL</b><div id="hello" style="margin-top:5px;opacity:.9">Control de stock</div></header>
<main class="wrap"><section id="auth" class="card"><h2>Ingresar</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Ingresar</button><p id="msg" class="muted">Cada persona ingresa con su propia cuenta.</p></section><section id="home" class="hide"><div id="head" class="card"></div><div id="work"></div></section></main>
<script>
const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');let me=null;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('msg').textContent=r.error.message;return}boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const ur=await sb.auth.getUser();const u=ur.data.user;if(!u)return;$('auth').classList.add('hide');$('home').classList.remove('hide');const pr=await sb.from('profiles').select('*').eq('id',u.id).single();me=pr.data;if(!me){alert('Tu perfil todavía no está disponible.');return}$('hello').textContent='Hola, '+me.full_name;renderHead();home()}
function renderHead(){const admin=me.role==='manager';$('head').innerHTML=`<span class="badge">${admin?'ADMINISTRACIÓN':'EMPLEADA'}</span><h2>${esc(me.full_name)}</h2>${admin?`<div class="nav"><button onclick="home()">Inicio</button><button class="sec" onclick="location.href='/app-vencimientos.html'">App</button><button class="sec" onclick="location.href='/expiry.html'">Vencimientos</button></div>`:''}<button class="ghost" onclick="logout()">Cerrar sesión</button>`}
function home(){$('work').innerHTML=`<div class="card"><h2>${me.role==='manager'?'Administración':'Mi turno'}</h2><button onclick="location.href='/app-vencimientos.html'">Abrir aplicación</button><button class="sec" onclick="location.href='/expiry.html'">📅 Vencimientos</button></div>`}
boot();
</script></body></html>
