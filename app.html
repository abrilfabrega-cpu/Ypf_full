<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#62bde9">
<link rel="manifest" href="manifest.webmanifest">
<title>YPF SANTA TERESITA FULL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:white;padding:27px 20px 23px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{font-size:13px;padding:12px 6px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}button:disabled{opacity:.55;cursor:not-allowed}.sec{background:#e7f6fd;color:#1979a8}.red{background:#c84c45}.ghost{background:#f7fcff;color:#1979a8;border:1px solid #c9eafa}.green{background:#16875d}.hide{display:none}.muted{font-size:13px;color:#6c8794}.tiny{font-size:12px;color:#6c8794}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}.prod{padding:13px 0;border-top:1px solid #e8f3f8}.stockrow{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px}.qty{font-size:22px;font-weight:800;text-align:right}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}input,textarea,select{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px;background:#fff}textarea{min-height:85px}h2{margin:7px 0 12px}h3{margin-top:23px}.item{padding:10px 0;border-bottom:1px solid #edf5f9}.alert{background:#fff7e7;border:1px solid #f0d49a;padding:12px;border-radius:14px;margin:8px 0}.okbox{background:#edf9f3;border:1px solid #cbe9d8;padding:12px;border-radius:14px}.money{font-size:24px;font-weight:800}.click{cursor:pointer}.prepared{background:#f7fcff;border:1px solid #d7effa;padding:15px;border-radius:16px;margin:12px 0}.calc{background:#edf9f3;border:1px solid #cbe9d8;padding:11px;border-radius:12px;margin:5px 0 12px;font-weight:700}.bigstock{font-size:34px;font-weight:800;margin:8px 0}.preparedAdmin{background:#f7fcff;border:1px solid #ccebf8;padding:18px;border-radius:18px;margin:12px 0}
</style></head><body>
<header class="top"><b>YPF SANTA TERESITA FULL</b><div id="hello" style="margin-top:5px;opacity:.9">Control de stock</div></header>
<main class="wrap"><section id="auth" class="card"><h2>Ingresar</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Ingresar</button><p id="msg" class="muted">Cada persona ingresa con su propia cuenta.</p></section><section id="home" class="hide"><div id="head" class="card"></div><div id="work"></div></section></main>
<script>
const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');
let me=null,shift=null,products=[],shiftUsage={},closingShift=false,preparedProducts=[],changingUsage=false;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>Number(n||0).toLocaleString('es-AR');
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('msg').textContent=r.error.message;return}boot()}async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){try{await sb.rpc('close_expired_shifts')}catch(e){console.error(e)}const u=(await sb.auth.getUser()).data.user;if(!u)return;$('auth').classList.add('hide');$('home').classList.remove('hide');me=(await sb.from('profiles').select('*').eq('id',u.id).single()).data;if(!me){alert('Tu perfil todavía no está disponible.');return}await loadProducts();await loadPreparedProducts();shift=(await sb.from('shifts').select('*').eq('employee_id',u.id).eq('status','open').maybeSingle()).data;$('hello').textContent='Hola, '+me.full_name;renderHead();if(me.role==='manager')adminHome();else if(shift)await loadShiftUsage();else employeeHome()}
async function loadProducts(){const r=await sb.from('products').select('*').eq('active',true).order('sort_order');products=r.error?[]:(r.data||[])}async function loadPreparedProducts(){const r=await sb.from('prepared_products').select('*').eq('active',true).order('sort_order');preparedProducts=r.error?[]:(r.data||[])}
function renderHead(){const admin=me.role==='manager';$('head').innerHTML=`<span class="badge">${admin?'ADMINISTRACIÓN':'EMPLEADA'}</span><h2>${esc(me.full_name)}</h2>${admin?`<div class="nav"><button onclick="adminHome()">Inicio</button><button class="sec" onclick="adminStock()">Stock</button><button class="sec" onclick="adminTurns()">Turnos</button></div>`:(shift?'<div class="okbox">Turno abierto · podés salir y volver cuando quieras.</div>':'')}<button class="ghost" onclick="logout()">Cerrar sesión</button>`}
function employeeHome(){$('work').innerHTML=`<div class="card"><h2>Mi turno</h2><p class="muted">Mañana: 07:00 a 15:15 · Tarde: 15:15 a 22:15.</p><p class="muted">Solo puede haber una empleada con el turno abierto.</p><button onclick="openShift('morning')">Abrir turno Mañana</button><button onclick="openShift('afternoon')">Abrir turno Tarde</button></div>`}
async function openShift(kind){if(shift){renderShift();return}const r=await sb.from('shifts').insert({employee_id:me.id,kind}).select().single();if(r.error){alert(r.error.message);return}shift=r.data;shiftUsage={};renderHead();renderShift()}
function employeeStock(){const ids=new Set(preparedProducts.map(x=>x.stock_product_id).filter(Boolean));return products.filter(p=>!ids.has(p.id)&&String(p.name||'').trim().toLowerCase()!=='medialunas'&&!['leche entera','leche descremada'].includes(String(p.name||'').trim().toLowerCase())).map(p=>`<div class="prod stockrow"><div><b>${esc(p.name)}</b><div class="tiny">Descuenta ${fmt(p.unit_step||1)} ${esc(p.unit_label||'unidad')} por toque</div><div class="tiny">Usado en este turno: <b>${fmt(shiftUsage[p.id]||0)}</b></div></div><div><div class="qty">${fmt(p.stock_qty)}</div><div class="tiny" style="text-align:right;margin-bottom:7px">Stock actual</div><button class="red" id="use_${p.id}" onclick="changeUsage('${p.id}')">− Restar</button></div></div>`).join('')}
async function loadShiftUsage(){if(!shift?.id)return;const r=await sb.from('shift_stock').select('product_id,used_qty').eq('shift_id',shift.id);shiftUsage={};(r.data||[]).forEach(x=>shiftUsage[x.product_id]=Number(x.used_qty||0));renderShift()}
async function changeUsage(id){if(changingUsage||!shift?.id)return;changingUsage=true;try{const r=await sb.rpc('adjust_shift_usage',{p_product:id,p_shift:shift.id,p_direction:1});if(r.error)throw r.error;shiftUsage[id]=Number(r.data||0);renderShift()}catch(e){alert('No se pudo registrar el descuento. '+(e.message||''))}finally{changingUsage=false}}
function preparedHTML(){return preparedProducts.map(p=>`<div class="prepared"><b>${esc(p.name)}</b><label>Cantidad que recibís al comenzar</label><input id="prep_open_${p.id}" type="number" min="0" step="1" oninput="updatePreparedCalculation('${p.id}')"><label>Cantidad que cocinás durante el turno</label><input id="prep_made_${p.id}" type="number" min="0" step="1" oninput="updatePreparedCalculation('${p.id}')"><label>Cantidad que queda al finalizar</label><input id="prep_close_${p.id}" type="number" min="0" step="1" oninput="updatePreparedCalculation('${p.id}')"><div class="calc" id="prep_calc_${p.id}">Vendidas: —</div><button class="sec" onclick="savePreparedProduct('${p.id}')">Guardar ${esc(p.name)}</button></div>`).join('')}
function updatePreparedCalculation(id){const a=$('prep_open_'+id)?.value,b=$('prep_made_'+id)?.value,c=$('prep_close_'+id)?.value,box=$('prep_calc_'+id);if(!box)return;if(a===''||b===''||c===''){box.textContent='Vendidas: —';return}const sold=Number(a)+Number(b)-Number(c);box.textContent=sold<0?'Revisá las cantidades':'Vendidas: '+fmt(sold)}
async function loadPreparedCounts(){const r=await sb.from('prepared_shift_counts').select('*').eq('shift_id',shift.id);(r.data||[]).forEach(x=>{const a=$('prep_open_'+x.prepared_product_id),b=$('prep_made_'+x.prepared_product_id),c=$('prep_close_'+x.prepared_product_id);if(a)a.value=x.opening_qty;if(b)b.value=x.made_qty;if(c&&x.closing_qty!=null)c.value=x.closing_qty;updatePreparedCalculation(x.prepared_product_id)})}
async function savePreparedProduct(id){const cv=$('prep_close_'+id)?.value;const r=await sb.from('prepared_shift_counts').upsert({shift_id:shift.id,prepared_product_id:id,user_id:me.id,opening_qty:Number($('prep_open_'+id)?.value||0),made_qty:Number($('prep_made_'+id)?.value||0),closing_qty:cv===''?null:Number(cv),updated_at:new Date().toISOString()},{onConflict:'shift_id,prepared_product_id'});if(r.error)alert(r.error.message);else alert('Guardado ✓')}
function renderShift(){$('work').innerHTML=`<div class="card"><h2>Turno abierto</h2><div class="badge">${shift.kind==='morning'?'MAÑANA':'TARDE'}</div><h3>Productos utilizados</h3>${employeeStock()}<h3>Elaborados</h3>${preparedHTML()}<h3>Leches utilizadas</h3><label>Leche entera</label><input id="wholeMilk" type="number" min="0" step="0.5" value="0"><label>Leche descremada</label><input id="skimMilk" type="number" min="0" step="0.5" value="0"><h3>Sobrante de caja</h3><input id="cashSurplus" type="number" min="0" step="1" value="0"><button class="red" onclick="showCloseSummary()">Cerrar turno</button></div>`;loadPreparedCounts();loadClosingFields()}
async function loadClosingFields(){const [m,s]=await Promise.all([sb.from('milk_usage').select('*').eq('shift_id',shift.id).maybeSingle(),sb.from('shifts').select('cash_surplus').eq('id',shift.id).single()]);if($('wholeMilk'))$('wholeMilk').value=m.data?.whole_boxes||0;if($('skimMilk'))$('skimMilk').value=m.data?.skim_boxes||0;if($('cashSurplus'))$('cashSurplus').value=s.data?.cash_surplus||0}
async function saveAllPreparedBeforeSummary(){for(const p of preparedProducts){const a=$('prep_open_'+p.id),b=$('prep_made_'+p.id),c=$('prep_close_'+p.id);if(c.value==='')throw new Error(`Completá la cantidad final de ${p.name}.`);const r=await sb.from('prepared_shift_counts').upsert({shift_id:shift.id,prepared_product_id:p.id,user_id:me.id,opening_qty:Number(a.value||0),made_qty:Number(b.value||0),closing_qty:Number(c.value),updated_at:new Date().toISOString()},{onConflict:'shift_id,prepared_product_id'});if(r.error)throw r.error}}
async function showCloseSummary(){try{await saveAllPreparedBeforeSummary();const whole=Number($('wholeMilk')?.value||0),skim=Number($('skimMilk')?.value||0),cash=Number($('cashSurplus')?.value||0);$('work').innerHTML=`<div class="card"><h2>Resumen para cerrar turno</h2><h3>Leches utilizadas</h3><div class="item">Leche entera <b style="float:right">${fmt(whole)}</b></div><div class="item">Leche descremada <b style="float:right">${fmt(skim)}</b></div><h3>Sobrante de caja</h3><div class="money">$ ${fmt(cash)}</div><button id="confirmCloseBtn" class="red" onclick="closeShift(${whole},${skim},${cash})">Confirmar y cerrar turno</button><button class="sec" onclick="renderShift()">Volver y corregir</button></div>`}catch(e){alert(e.message||String(e))}}
async function closeShift(whole,skim,cash){if(closingShift)return;closingShift=true;try{const r=await sb.rpc('close_shift_atomic',{p_shift:shift.id,p_whole:Number(whole||0),p_skim:Number(skim||0),p_cash:Number(cash||0)});if(r.error)throw r.error;shift=null;shiftUsage={};await loadProducts();renderHead();employeeHome();alert('Turno cerrado correctamente ✓')}catch(e){alert('No se pudo cerrar el turno. '+(e.message||''))}finally{closingShift=false}}
async function adminHome(){$('work').innerHTML=`<div class="card"><h2>Administración</h2><button onclick="adminStock()">Control de stock</button><button class="sec" onclick="adminPrepared()">Elaborados</button><button class="sec" onclick="adminProducts()">Productos</button><button class="sec" onclick="adminTurns()">Turnos</button><button class="sec" onclick="adminAlerts()">Alertas</button></div><div id="dash"></div>`;adminAlerts(true)}
function adminStock(){$('work').innerHTML=`<div class="card"><h2>Control de stock</h2>${products.map(p=>`<div class="prod"><b>${esc(p.name)}</b><div class="tiny">Stock actual: ${fmt(p.stock_qty)} · ${esc(p.unit_label)}</div><input id="add${p.id}" type="number" min="0" step="${p.unit_step}" placeholder="Cantidad"><div class="row"><button onclick="addStock('${p.id}')">+ Cargar</button><button class="sec" onclick="discountStock('${p.id}')">− Descontar</button></div></div>`).join('')}<button class="green" onclick="adminHome()">Cerrar control de stock</button></div>`}
async function addStock(id){const v=Number($('add'+id)?.value||0);if(v<=0)return;const r=await sb.rpc('manager_adjust_stock',{p_product:id,p_delta:v});if(r.error)alert(r.error.message);else{await loadProducts();adminStock()}}async function discountStock(id){const v=Number($('add'+id)?.value||0);if(v<=0)return;const r=await sb.rpc('manager_adjust_stock',{p_product:id,p_delta:-v});if(r.error)alert(r.error.message);else{await loadProducts();adminStock()}}
function adminPrepared(){adminStock()}function adminProducts(){adminStock()}
async function adminTurns(){const r=await sb.from('shifts').select('*,profiles(full_name)').order('opened_at',{ascending:false}).limit(80);$('work').innerHTML=`<div class="card"><h2>Turnos</h2>${(r.data||[]).map(s=>`<div class="prod"><b>${esc(s.profiles?.full_name||'Empleado')}</b> · ${s.kind==='morning'?'Mañana':'Tarde'}<div class="tiny">${new Date(s.opened_at).toLocaleString('es-AR')} · ${s.status==='closed'?'Cerrado':'ABIERTO'}</div></div>`).join('')}</div>`}
async function adminAlerts(inDash=false){const html='<div class="okbox">Alertas disponibles desde los cierres de turno.</div>';if(inDash&&$('dash'))$('dash').innerHTML=`<div class="card"><h2>Alertas recientes</h2>${html}</div>`;else $('work').innerHTML=`<div class="card"><h2>Alertas</h2>${html}</div>`}
boot();
</script></body></html>
