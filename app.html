<body>

<header class="top">
<b>YPF SANTA TERESITA FULL</b>
<div id="hello" style="margin-top:5px;opacity:.9">Control de stock</div>
</header>

<main class="wrap">

<section id="auth" class="card">
<h2>Ingresar</h2>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Contraseña">
<button id="loginButton" type="button" onclick="login()">Ingresar</button>
<p id="msg" class="muted">Cada persona ingresa con su propia cuenta.</p>
</section>

<section id="home" class="hide">
<div id="head" class="card"></div>
<div id="work"></div>
</section>

</main>

<script>

if(!window.supabase){document.getElementById('msg').textContent='No se pudo cargar la conexión de la aplicación. Comprobá Internet y volvé a abrirla.';throw new Error('Supabase SDK no disponible');}
const sb=supabase.createClient(
'https://sblkngrblimfhhkqilop.supabase.co',
'sb_publishable_CipXByoTnXEwjcYMXN3Btg_zyI104nD'
);

let me=null;
let shift=null;
let products=[];
let shiftUsage={};
let closingShift=false;
let preparedProducts=[];
let changingUsage=false;

const $=x=>document.getElementById(x);

const esc=s=>String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

const fmt=n=>Number(n||0).toLocaleString('es-AR');

let loginInProgress=false;
async function login(){
 const msg=$('msg'),button=document.getElementById('loginButton');
 if(loginInProgress)return;
 const email=$('email').value.trim(),password=$('pass').value;
 if(!email||!password){msg.textContent='Ingresá tu correo y contraseña.';return;}
 loginInProgress=true;
 if(button){button.disabled=true;button.textContent='Ingresando…';}
 msg.textContent='Verificando tu cuenta…';
 try{
  if(!window.supabase||!sb?.auth)throw new Error('No se cargó la conexión. Cerrá y volvé a abrir la aplicación.');
  const result=await Promise.race([
   sb.auth.signInWithPassword({email,password}),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error('La conexión tardó demasiado. Revisá Internet y volvé a intentar.')),15000))
  ]);
  if(result.error)throw result.error;
  msg.textContent='Acceso correcto. Cargando tu turno…';
  await Promise.race([
   boot(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error('Se inició sesión, pero la carga tardó demasiado. Cerrá y volvé a abrir la aplicación.')),20000))
  ]);
  if(!$('auth').classList.contains('hide'))throw new Error('No se pudo abrir tu perfil. Avisá a la encargada.');
 }catch(e){
  console.error('Error al ingresar',e);
  const message=String(e?.message||e);
  msg.textContent=/Invalid login credentials/i.test(message)?'El correo o la contraseña no coinciden. Revisalos e intentá nuevamente.': 'No se pudo ingresar: '+message;
 }finally{
  loginInProgress=false;
  if(button){button.disabled=false;button.textContent='Ingresar';}
 }
}

async function logout(){
await sb.auth.signOut();
location.reload();
}

async function boot(){

try{
await sb.rpc('close_expired_shifts');
}catch(e){
console.error(e);
}

const userResult=await sb.auth.getUser();
const u=userResult.data.user;

if(!u)return;

$('auth').classList.add('hide');
$('home').classList.remove('hide');

const profileResult=await sb
.from('profiles')
.select('*')
.eq('id',u.id)
.single();

me=profileResult.data;

if(!me){
alert('Tu perfil todavía no está disponible.');
return;
}

await loadProducts();
await loadPreparedProducts();

const shiftResult=await sb
.from('shifts')
.select('*')
.eq('employee_id',u.id)
.eq('status','open')
.maybeSingle();

shift=shiftResult.data;

$('hello').textContent='Hola, '+me.full_name;

renderHead();

if(me.role==='manager'){
adminHome();
}else if(shift){
await loadShiftUsage();
}else{
employeeHome();
}
}

async function loadProducts(){

const r=await sb
.from('products')
.select('*')
.eq('active',true)
.order('sort_order');

if(r.error){
console.error(r.error);
products=[];
return;
}

products=r.data||[];
}

async function loadPreparedProducts(){

const r=await sb
.from('prepared_products')
.select('*')
.eq('active',true)
.order('sort_order');

if(r.error){
console.error(r.error);
preparedProducts=[];
return;
}

preparedProducts=r.data||[];
}

function renderHead(){

const admin=me.role==='manager';

$('head').innerHTML=`

<span class="badge">
${admin?'ADMINISTRACIÓN':'EMPLEADA'}
</span>

<h2>${esc(me.full_name)}</h2>

${admin?`

<div class="nav">

<button onclick="adminHome()">Inicio</button>

<button class="sec" onclick="adminStock()">
Stock
</button>

<button class="sec" onclick="adminTurns()">
Turnos
</button>

</div>

`:

`${shift
?'<div class="okbox">Turno abierto · podés salir y volver cuando quieras.</div>'
:''
}`}

<button class="ghost" onclick="logout()">
Cerrar sesión
</button>
`;
}

function employeeHome(){

$('work').innerHTML=`

<div class="card">

<h2>Mi turno</h2>

<p class="muted">
Mañana y tarde: sin horario fijo. Cerrá tu turno para que la siguiente empleada pueda abrir el suyo. A las 00:00 se cierra automáticamente el turno que siga abierto.
</p>

<p class="muted">
Solo puede haber una empleada con el turno abierto.
</p>

<button onclick="openShift('morning')">
Abrir turno Mañana
</button>

<button onclick="openShift('afternoon')">
Abrir turno Tarde
</button>

</div>
`;
}

async function openShift(kind){

if(shift){
renderShift();
return;
}

const r=await sb
.from('shifts')
.insert({
employee_id:me.id,
kind
})
.select()
.single();

if(r.error){
alert(r.error.message);
return;
}

shift=r.data;
shiftUsage={};

renderHead();
renderShift();
}


/* ==========================================
   STOCK DE EMPLEADAS
   SOLO PUEDEN REGISTRAR CONSUMO / RESTAR
   ========================================== */

function employeeStock(){

const preparedStockIds=new Set(
preparedProducts
.map(x=>x.stock_product_id)
.filter(Boolean)
);

const manualProducts=products.filter(p=>{

const linked=preparedStockIds.has(p.id);

const normalizedName=String(p.name||'').trim().toLowerCase();

const medialunas=normalizedName==='medialunas';
const bread= /^pan(?:\s|$)/i.test(normalizedName);
return !linked && !medialunas && !bread && !['leche entera','leche descremada','leche de almendras'].includes(normalizedName);
});

return manualProducts.map(p=>{

const used=Number(shiftUsage[p.id]||0);
const step=Number(p.unit_step||1);

return `

<div class="prod stockrow">

<div>

<b>${esc(p.name)}</b>

<div class="tiny">
Descuenta ${fmt(step)}
${esc(p.unit_label||'unidad')} por toque
</div>

<div class="tiny">
Usado en este turno:
<b>${fmt(used)}</b>
</div>

</div>

<div>

<div class="qty">
${fmt(p.stock_qty)}
</div>

<div class="tiny"
style="text-align:right;margin-bottom:7px">
Stock actual
</div>

<button
class="red"
id="use_${p.id}"
onclick="changeUsage('${p.id}')">
− Restar
</button>

</div>

</div>

`;

}).join('');
}


/* ==========================================
   CARGAR CONSUMO DEL TURNO
   ========================================== */

async function loadShiftUsage(){

if(!shift?.id){
shiftUsage={};
return;
}

const r=await sb
.from('shift_stock')
.select('product_id,used_qty')
.eq('shift_id',shift.id);

if(r.error){
console.error(r.error);
return;
}

shiftUsage={};

(r.data||[]).forEach(x=>{
shiftUsage[x.product_id]=Number(x.used_qty||0);
});

if($('work') && shift){
renderShift();
}
}


/* ==========================================
   EMPLEADA RESTA PRODUCTO
   ========================================== */

async function changeUsage(id){

if(changingUsage)return;

if(!shift?.id){
alert('No hay un turno abierto.');
return;
}

/* Seguridad adicional en frontend */
if(me?.role==='manager'){
alert('Esta función corresponde al turno de empleadas.');
return;
}

const product=products.find(p=>p.id===id);

if(!product){
alert('No se encontró el producto.');
return;
}

changingUsage=true;

const button=$('use_'+id);

if(button){
button.disabled=true;
button.textContent='Guardando...';
}

try{

/*
p_direction = 1 significa:
AGREGAR una unidad al CONSUMO DEL TURNO.

NO suma stock.

El stock real se descuenta cuando
se confirma el cierre del turno.
*/

const r=await sb.rpc(
'adjust_shift_usage',
{
p_product:id,
p_shift:shift.id,
p_direction:1
}
);

if(r.error){
throw r.error;
}

shiftUsage[id]=Number(r.data||0);

renderShift();

}catch(e){

console.error(e);

alert(
'No se pudo registrar el descuento. '+
(e.message||'Intentá nuevamente.')
);

if(button){
button.disabled=false;
button.textContent='− Restar';
}

}finally{

changingUsage=false;

}
}


/* ==========================================
   ELABORADOS
   ========================================== */

function preparedHTML(){

if(!preparedProducts.length){

return `
<p class="muted">
No hay productos elaborados configurados.
</p>
`;
}

return preparedProducts.map(p=>`

<div class="prepared">

<b>${esc(p.name)}</b>

<p class="tiny">
Completá las cantidades del turno.
La aplicación calcula automáticamente lo vendido.
</p>

<label>
Cantidad que recibís al comenzar
</label>

<input
id="prep_open_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que cocinás durante el turno
</label>

<input
id="prep_made_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que queda al finalizar
</label>

<input
id="prep_close_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<div
class="calc"
id="prep_calc_${p.id}">
Vendidas: —
</div>

<button
class="sec"
onclick="savePreparedProduct('${p.id}')">
Guardar ${esc(p.name)}
</button>

</div>

`).join('');
}

function updatePreparedCalculation(id){

const a=$('prep_open_'+id)?.value;
const b=$('prep_made_'+id)?.value;
const c=$('prep_close_'+id)?.value;

const box=$('prep_calc_'+id);

if(!box)return;

if(a===''||b===''||c===''){

box.textContent='Vendidas: —';

return;
}

const opening=Number(a);
const made=Number(b);
const closing=Number(c);

const sold=opening+made-closing;

if(sold<0){

box.textContent='Revisá las cantidades';

return;
}

box.textContent='Vendidas: '+fmt(sold);
}

async function loadPreparedCounts(){

if(!shift)return;

const r=await sb
.from('prepared_shift_counts')
.select('*')
.eq('shift_id',shift.id);

if(r.error){

console.error(r.error);

return;
}

(r.data||[]).forEach(x=>{

const a=$(
'prep_open_'+x.prepared_product_id
);

const b=$(
'prep_made_'+x.prepared_product_id
);

const c=$(
'prep_close_'+x.prepared_product_id
);

if(a)a.value=x.opening_qty;

if(b)b.value=x.made_qty;

if(c && x.closing_qty!=null){
c.value=x.closing_qty;
}

updatePreparedCalculation(
x.prepared_product_id
);

});
}

async function savePreparedProduct(id){

if(!shift)return;

const opening=
Number(
$('prep_open_'+id)?.value||0
);

const made=
Number(
$('prep_made_'+id)?.value||0
);

const closeValue=
$('prep_close_'+id)?.value;

const closing=
closeValue===''?
null:
Number(closeValue);

const r=await sb
.from('prepared_shift_counts')
.upsert({

shift_id:shift.id,

prepared_product_id:id,

user_id:me.id,

opening_qty:opening,

made_qty:made,

closing_qty:closing,

updated_at:new Date().toISOString()

},{
onConflict:'shift_id,prepared_product_id'
});

if(r.error){

alert(r.error.message);

return;
}

alert('Guardado ✓');
}


/* ==========================================
   TURNO EMPLEADA

async function renderShift(){

if(!shift)return;

await loadPreparedProducts();

$('work').innerHTML=`

<div class="card">

<h2>Turno abierto</h2>

<div class="badge">
${shift.kind==='morning'?'MAÑANA':'TARDE'}
</div>

<h3>Productos utilizados</h3>

<p class="muted">
Tocá − Restar cada vez que utilices un producto.
El stock real se descuenta al confirmar el cierre del turno.
</p>

${employeeStock()}

<button class="sec" onclick="nonconformingForm()">⚠️ Registrar producto no conforme</button>\n\n<h3>Elaborados</h3>

${preparedHTML()}

<h3>Leches utilizadas</h3>\n<p class="muted">Ingresá el consumo total de cada leche en este turno (por ejemplo 0,5 o 1,5). Podés escribir coma o punto. No redondees sachets abiertos a llenos o vacíos. El stock se descuenta al cerrar el turno.</p>\n${milkQuantityHTML()}\n\n<h3>Sobrante de caja</h3>

<input
id="cashSurplus"
type="number"

<button

`;

async function loadClosingFields(){

if(!shift)return;

const shiftR=await sb.from('shifts').select('cash_surplus').eq('id',shift.id).single();

if($('cashSurplus')){

$('cashSurplus').value=
shiftR.data?.cash_surplus||0;

}
}

async function saveAllPreparedBeforeSummary(){

for(const p of preparedProducts){

const a=$('prep_open_'+p.id);
const b=$('prep_made_'+p.id);
const c=$('prep_close_'+p.id);

if(!a||!b||!c)continue;

if(c.value===''){

throw new Error(
`Completá la cantidad final de ${p.name}.`
);

}

const opening=Number(a.value||0);
const made=Number(b.value||0);
const closing=Number(c.value);

if(opening+made-closing<0){

throw new Error(
`Revisá las cantidades de ${p.name}.`
);

}

const r=await sb
.from('prepared_shift_counts')
.upsert({

shift_id:shift.id,

prepared_product_id:p.id,

user_id:me.id,

opening_qty:opening,

made_qty:made,

closing_qty:closing,

updated_at:new Date().toISOString()

},{
onConflict:'shift_id,prepared_product_id'
});

if(r.error){
throw r.error;
}

}
}

async function showCloseSummary(){

if(closingShift||!shift)return;

try{

await saveAllPreparedBeforeSummary();


const whole=0;
const skim=0;
const cash=Number($('cashSurplus')?.value||0);

const usageRows=products

.filter(
p=>Number(shiftUsage[p.id]||0)>0
)

.map(p=>`

<div class="item">

${esc(p.name)}

<b style="float:right">
${fmt(shiftUsage[p.id])}
</b>

</div>

`)

.join('');

const preparedRows=
preparedProducts.map(p=>{

const a=
Number(
$('prep_open_'+p.id)?.value||0
);

const b=
Number(
$('prep_made_'+p.id)?.value||0
);

const c=
Number(
$('prep_close_'+p.id)?.value||0
);

return `

<div class="item">

${esc(p.name)}

<b style="float:right">
${fmt(a+b-c)} vendidas
</b>

</div>

`;

}).join('');

$('work').innerHTML=`

<div class="card">

<h2>
Resumen para cerrar turno
</h2>

<p class="muted">
Revisá todo antes de confirmar.
Hasta que no confirmes, el stock real no se modifica.
</p>

<h3>Productos utilizados</h3>

${usageRows||
'<p class="muted">No se cargaron productos.</p>'}

<h3>Elaborados</h3>

${preparedRows||
'<p class="muted">Sin elaborados.</p>'}

<h3>Sobrante de caja</h3>

<div class="money">
$ ${fmt(cash)}
</div>

<button
id="confirmCloseBtn"
class="red"
onclick="closeShift(${whole},${skim},${cash})">
Confirmar y cerrar turno
</button>

<button
class="sec"
onclick="renderShift()">
Volver y corregir
</button>

</div>
`;

}catch(e){

alert(
e.message||String(e)
);

}
}

async function closeShift(whole,skim,cash){

if(closingShift||!shift)return;

closingShift=true;

const btn=$('confirmCloseBtn');

if(btn){

btn.disabled=true;

btn.textContent=
'Cerrando turno...';

}

try{

const r=await sb.rpc(
'close_shift_atomic',
{

p_shift:shift.id,

p_whole:Number(whole||0),

p_skim:Number(skim||0),

p_cash:Number(cash||0)

}
);

if(r.error){
throw r.error;
}

const verify=await sb
.from('shifts')
.select('status,closed_at')
.eq('id',shift.id)
.single();

if(verify.error){
throw verify.error;
}

if(verify.data?.status!=='closed'){

throw new Error(
'El cierre no fue confirmado por la base de datos.'
);

}

shift=null;
shiftUsage={};

await loadProducts();

renderHead();

employeeHome();

alert(
'Turno cerrado correctamente ✓'
);

}catch(e){

alert(
'No se pudo cerrar el turno. No se aplicó el cierre. '+
(e.message||'')
);

if(btn){

btn.disabled=false;

btn.textContent=
'Confirmar y cerrar turno';

}

}finally{

closingShift=false;

}
}

<h2>Administración</h2>\n\n<button class="sec" onclick="adminNonconforming()">⚠️ Productos no conformes</button>

<button onclick="window.top.location.href=&#39;/stock-audit.html&#39;">📋 Auditoría de stock e historial</button>

<button onclick="adminStock()">
Control de stock
</button>

<button
class="sec"
onclick="adminPrepared()">
Elaborados
</button>

<button
class="sec"
onclick="adminProducts()">
Productos
</button>

<button
class="sec"

?'—'

</b>

async function adminAlerts(inDash=false){

const r=await sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('status','closed')
.order(
'closed_at',
{ascending:false}
)
.limit(15);

let alerts=[];

for(const s of (r.data||[])){

if(Number(s.cash_surplus)>0){

alerts.push(`

<div class="alert">

<b>

Diferencia de caja ·

${esc(
s.profiles?.full_name||
''
)}

</b>

<br>

Sobrante:

$ ${fmt(s.cash_surplus)}

</div>

`);

}

}

const cr=await sb
.from('prepared_shift_counts')
.select(
'*,prepared_products(name),shifts(opened_at,status,employee_id,profiles(full_name))'
)
.order(
'updated_at',
{ascending:false}
)
.limit(100);

const grouped={};

(cr.data||[])

.filter(
x=>x.shifts?.status==='closed'
)

.forEach(x=>{

const key=
x.prepared_product_id;

if(!grouped[key]){

grouped[key]=[];

}

grouped[key].push(x);

});

Object.values(grouped)

.forEach(arr=>{

arr.sort(
(a,b)=>
new Date(a.shifts.opened_at)
-
new Date(b.shifts.opened_at)
);

for(
let i=1;
i<arr.length;
i++
){

const prev=arr[i-1];
const cur=arr[i];

if(

prev.closing_qty!=null &&

cur.opening_qty!=null &&

Number(prev.closing_qty)!==
Number(cur.opening_qty)

){

const d=
Number(prev.closing_qty)
-
Number(cur.opening_qty);

alerts.push(`

<div class="alert">

<b>

Diferencia de

${esc(
cur.prepared_products?.name||
'elaborado'
)}

</b>

<br>

${esc(
prev.shifts.profiles?.full_name||
'Turno anterior'
)}

dejó

${fmt(prev.closing_qty)};

${esc(
cur.shifts.profiles?.full_name||
'turno siguiente'
)}

recibió

${fmt(cur.opening_qty)}.

<b>

${d>0
?'Faltan '+fmt(d)
:'Sobran '+fmt(Math.abs(d))}

</b>

</div>

`);

}

}

});

const html=
alerts.join('')

||

'<div class="okbox">No hay alertas pendientes en los últimos cierres.</div>';

if(inDash){

const d=$('dash');

if(d){

d.innerHTML=`

<div class="card">

<h2>Alertas recientes</h2>

${html}

</div>

`;

}

}else{

$('work').innerHTML=`

<div class="card">

<h2>Alertas</h2>

${html}

</div>

`;

}

}

function nonconformingForm(){

 $('work').innerHTML=`<div class="card"><h2>⚠️ Productos no conformes</h2>
 <p class="muted">Registrá productos rotos, vencidos o que salieron mal. Esto NO descuenta stock.</p>
 <label>Producto</label><input id="nc_product" list="nc_options" placeholder="Nombre del producto"><datalist id="nc_options">${choices}</datalist>
 <label>Cantidad</label><input id="nc_qty" type="number" min="0.5" step="any" placeholder="Ej.: 5">
 <label>Motivo</label><select id="nc_reason" style="width:100%;padding:13px;border-radius:12px;border:1px solid #c9eafa">
 <option>Roto</option><option>Mal preparado</option><option>Quemado</option><option>Vencido</option><option>Otro</option></select>
 <label>Detalle (opcional)</label><textarea id="nc_notes" rows="3" style="width:100%;padding:12px;border-radius:12px" placeholder="Ej.: 5 sándwiches salieron torcidos"></textarea>
 <label>Foto (opcional, hasta 5 MB)</label><input id="nc_photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
 <button id="nc_save" onclick="saveNonconforming()">Guardar aviso</button>
 <button class="sec" onclick="renderShift()">Volver al turno</button></div>`;
}
async function saveNonconforming(){
 const name=$('nc_product').value.trim(),qty=Number($('nc_qty').value),reason=$('nc_reason').value,notes=$('nc_notes').value.trim(),file=$('nc_photo').files[0];
 if(!name||!Number.isFinite(qty)||qty<=0)return alert('Ingresá el producto y una cantidad válida.');
 if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5242880))return alert('La foto debe ser JPG, PNG o WebP y pesar menos de 5 MB.');
 const btn=$('nc_save');btn.disabled=true;btn.textContent='Guardando...';
 let path=null;
 try{
  if(file){const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';path=me.id+'/'+crypto.randomUUID()+'.'+ext;
   const u=await sb.storage.from('nonconforming-photos').upload(path,file,{contentType:file.type,upsert:false});if(u.error)throw u.error;}
  const p=products.find(x=>x.name.toLowerCase()===name.toLowerCase());
  const r=await sb.from('nonconforming_products').insert({shift_id:shift.id,employee_id:me.id,product_id:p?.id||null,product_name:name,quantity:qty,reason,notes,photo_path:path});
  if(r.error)throw r.error;
  alert('Aviso guardado ✓ No se descontó stock.');renderShift();
 }catch(e){alert('No se pudo guardar: '+(e.message||e));btn.disabled=false;btn.textContent='Guardar aviso';}
}

 if(me.role!=='manager')return;
 $('work').innerHTML='<div class="card"><h2>Productos no conformes</h2><p>Cargando registros...</p></div>';

 if(r.error){$('work').innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return;}
 const rows=r.data||[],names={};
 const ids=[...new Set(rows.map(x=>x.employee_id))];

 const signed=await Promise.all(rows.map(async x=>x.photo_path?(await sb.storage.from('nonconforming-photos').createSignedUrl(x.photo_path,3600)).data?.signedUrl:null));
 $('work').innerHTML=`<div class="card"><h2>⚠️ Productos no conformes</h2>

 ${rows.length?rows.map((x,i)=>`<div class="item"><b>${esc(x.product_name)}</b> · ${Number(x.quantity).toLocaleString('es-AR')} unidades
 <div>${esc(x.reason)}${x.notes?' · '+esc(x.notes):''}</div>
 <div class="tiny">${esc(names[x.employee_id]||'Empleada')} · ${new Date(x.created_at).toLocaleString('es-AR')}</div>

}

function milkQuantityHTML(){

 const used=Number(shiftUsage[p.id]||0);

 }).join('');
}
async function saveMilkQuantity(id){
 if(changingUsage||!shift?.id)return;
 const p=products.find(x=>x.id===id);
 const field=$('milk_qty_'+id);
 if(!p||!field)return;
 const raw=field.value.trim().replace(/\s/g,'').replace(',','.');
 const qty=Number(raw);
 if(!raw||!Number.isFinite(qty)||qty<0||Math.abs(qty*2-Math.round(qty*2))>0.000001){alert('Ingresá una cantidad válida: 0, 0,5, 1, 1,5, etc.');return;}
 const old=Number(shiftUsage[id]||0),difference=qty-old;
 if(difference===0){alert('Esa cantidad ya está registrada.');return;}
 const msg=difference>0?'¿Confirmás registrar '+fmt(difference)+' cajas adicionales de '+p.name+'? Total del turno: '+fmt(qty)+'.':'¿Confirmás corregir '+p.name+' de '+fmt(old)+' a '+fmt(qty)+' cajas?';
 if(!confirm(msg+' El stock se actualizará al cerrar el turno.'))return;
 changingUsage=true;const btn=$('milk_save_'+id);if(btn)btn.disabled=true;
 try{
 const r=await sb.rpc('set_milk_shift_usage',{p_product:id,p_shift:shift.id,p_quantity:qty});
 if(r.error)throw r.error;
 shiftUsage[id]=Number(r.data);
 renderShift();
 }catch(e){alert('No se pudo guardar: '+(e.message||e));if(btn)btn.disabled=false;}
 finally{changingUsage=false;}
}
</script>
