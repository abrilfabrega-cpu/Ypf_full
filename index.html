gin:8px 0 12px"><input id="shiftNoNotes" type="checkbox" style="width:auto;margin:0"> No hay notas</label><button type="button" class="sec">Guardar notas</button>';box.querySelector('button').onclick=()=>saveNotes(d);const close=[...card.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Cerrar turno'));card.insertBefore(box,close||null);loadNotes(d)}}if(card&&!d.getElementById('breadEmployeeTop')){const box=d.createElement('div');box.id='breadEmployeeTop';box.style.cssText='background:#fff7e7;border:1px solid #f0d49a;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#9a6810;margin-bottom:6px">🍞 Panes</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Registrá cada rodaja del pan que está en uso.</div><button type="button" style="margin:0">Abrir Panes</button>';box.querySelector('button').onclick=goBread;card.insertBefore(box,card.firstChild)}if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b>📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin:6px 0 9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button>Abrir vencimientos</button>';box.querySelector('button').onclick=goExpiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error(e)}}setInterval(inject,250);root.addEventListener('load',()=>setTimeout(inject,500));loadApp();</script></body></html>
