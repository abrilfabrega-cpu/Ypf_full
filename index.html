function auth(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.includes('auth-token'))continue;try{let x=JSON.parse(localStorage.getItem(k)||'null');for(let n=0;n<4&&x;n++){if(x.access_token&&x.user?.id)return {token:x.access_token,uid:x.user.id};x=x.currentSession||x.session||x.data||null}}catch{}}return null}async function noteReq(path,opt={}){const a=auth();if(!a)throw new Error('No se encontró la sesión');return fetch(API+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+a.token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation',...(opt.headers||{})}})}async function currentShift(){const a=auth();if(!a)return null;const r=await noteReq('shifts?employee_id=eq.'+a.uid+'&status=eq.open&select=id&limit=1');const j=await r.json();return j?.[0]?.id||null}async function loadNotes(d){try{const sid=await currentShift();if(!sid)return;const r=await noteReq('shift_notes?shift_id=eq.'+sid+'&select=note,no_notes');const j=await r.json(),x=j?.[0];const ta=d.getElementById('shiftNoteText'),ck=d.getElementById('shiftNoNotes');if(ta)ta.value=x?.note||'';if(ck)ck.checked=!!x?.no_notes}catch(e){console.error('Notas',e)}}async function saveNotes(d){try{const a=auth(),sid=await currentShift();if(!a||!sid)throw new Error('No hay un turno abierto');const ta=d.getElementById('shiftNoteText'),ck=d.getElementById('shiftNoNotes'),no=!!ck?.checked,note=(ta?.value||'').trim();if(!no&&!note)throw new Error('Escribí una nota o marcá “No hay notas”.');const r=await noteReq('shift_notes?on_conflict=shift_id',{method:'POST',body:JSON.stringify({shift_id:sid,user_id:a.uid,note:no?'':note,no_notes:no,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error((await r.text())||'No se pudo guardar');alert('Notas guardadas ✓')}catch(e){alert(e.message||e)}}
async function adjustTostado(d,delta){try{const card=[...d.querySelectorAll('.preparedAdmin')].find(x=>(x.querySelector('b')?.textContent||'').trim().toLowerCase()==='tostados');if(!card)return;const input=card.querySelector('input[id^="prepstock_"]');if(!input)return;const id=input.id.replace('prepstock_','');const sb=d.defaultView.sb;if(!sb)throw new Error('No se pudo conectar');const r=await sb.rpc('manager_adjust_stock',{p_product:id,p_delta:delta});if(r.error)throw r.error;await d.defaultView.loadProducts();d.defaultView.adminPrepared()}catch(e){alert(e.message||e)}}

function inject(){try{const od=root.contentDocument;if(!od)return;const inner=od.getElementById('app');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument,home=d.getElementById('home');if(!home||home.classList.contains('hide'))return;const badge=(d.querySelector('#head .badge')?.textContent||'').trim().toUpperCase(),isAdmin=badge.includes('ADMINISTRACIÓN');if(isAdmin){const nav=d.querySelector('#head .nav');if(nav){nav.style.gridTemplateColumns='repeat(2,1fr)';const stockBtn=[...nav.querySelectorAll('button')].find(b=>(b.textContent||'').trim()==='Stock'||(b.textContent||'').includes('Insumos'));if(stockBtn){stockBtn.textContent='📦 Insumos';stockBtn.id='insumosAdminTop'}if(!d.getElementById('expiryAdminTop')){const b=d.createElement('button');b.id='expiryAdminTop';b.className='sec';b.textContent='📅 Vencimientos';b.onclick=goExpiry;nav.appendChild(b)}if(!d.getElementById('yieldAdminTop')){const b=d.createElement('button');b.id='yieldAdminTop';b.className='sec';b.textContent='📊 Rendimientos';b.onclick=goYield;nav.appendChild(b)}}if(!d.getElementById('cigAdminTop')){const b=d.createElement('button');b.id='cigAdminTop';b.className='sec';b.textContent='🚬 Cigarrillos';b.onclick=goCig;nav.appendChild(b)}patchTostados(d)}else{const work=d.getElementById('work'),card=work&&work.querySelector('.card');if(card){const h=[...card.querySelectorAll('h3')].find(x=>(x.textContent||'').trim()==='Productos utilizados');if(h)h.textContent='📦 Insumos utilizados';const openHeading=[...card.querySelectorAll('h2')].some(x=>(x.textContent||'').includes('Turno abierto'));if(openHeading&&!d.getElementById('shiftNotesBox')){const box=d.createElement('div');box.id='shiftNotesBox';box.style.cssText='margin-top:22px;padding-top:4px;border-top:1px solid #edf5f9';box.innerHTML='<h3>📝 Notas</h3><p class="muted">Dejá cualquier observación de este turno.</p><textarea id="shiftNoteText" placeholder="Escribí acá cualquier nota del turno"></textarea><label style="display:flex;gap:8px;align-items:center;margin:8px 0 12px"><input id="shiftNoNotes" type="checkbox" style="width:auto;margin:0"> No hay notas</label><button type="button" class="sec">Guardar notas</button>';box.querySelector('button').onclick=()=>saveNotes(d);const close=[...card.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Cerrar turno'));card.insertBefore(box,close||null);loadNotes(d)}}if(card&&!d.getElementById('cigEmployeeTop')){const box=d.createElement('div');box.id='cigEmployeeTop';box.style.cssText='background:#fff5e9;border:1px solid #f1d5ad;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b>🚬 Control de cigarrillos</b><p class="muted">Registrá recibe, ingresa, queda y la plata real de diferencia.</p><button type="button" class="sec">Abrir control de cigarrillos</button>';box.querySelector('button').onclick=goCig;card.insertBefore(box,card.firstChild)}if(card&&!d.getElementById('yieldEmployeeTop')){const box=d.createElement('div');box.id='yieldEmployeeTop';box.style.cssText='background:#edf9f3;border:1px solid #cbe9d8;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b>☕ Rendimientos e insumos</b><div style="font-size:13px;color:#53766a;margin:6px 0 9px">Abrí o cerrá bolsas de café, cajas de azúcar y otros insumos para registrar cuánto duran.</div><button type="button" class="sec">Abrir rendimientos</button>';box.querySelector('button').onclick=goYield;card.insertBefore(box,card.firstChild)}if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#1979a8;margin-bottom:6px">📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button type="button" style="margin:0">Abrir vencimientos</button>';box.querySelector('button').onclick=goExpiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error('UI',e)}}setInterval(inject,250);root.addEventListener('load',()=>setTimeout(inject,400));
