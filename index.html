);

const esc=s=>String(s??'').replace(
/[&<>"']/g,

'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'

password:$('pass').value

}

}

await sb.auth.signOut();

}

async function boot(){

try{
await sb.rpc('close_expired_shifts');
}catch(e){

}

const u=userResult.data.user;

$('home').classList.remove('hide');

.from('profiles')
.select('*')
.eq('id',u.id)
.single();

me=profileResult.data;

if(!me){
alert('Tu perfil todavía no está disponible.');
return;
}

await loadProducts();
await loadPreparedProducts();

const shiftResult=await sb
.from('shifts')
.select('*')
.eq('employee_id',u.id)
.eq('status','open')
.maybeSingle();

shift=shiftResult.data;

$('hello').textContent='Hola, '+me.full_name;

renderHead();

if(me.role==='manager'){

}else if(shift){
await loadShiftUsage();
}else{

}
}

async function loadProducts(){

const r=await sb
.from('products')
.select('*')
.eq('active',true)
.order('sort_order');

return;
}

products=r.data||[];
}

const r=await sb

async function openShift(kind){

}

const r=await sb

/* ==========================================
   STOCK DE EMPLEADAS
   SOLO PUEDEN REGISTRAR CONSUMO / RESTAR
   ========================================== */

function employeeStock(){

const preparedStockIds=new Set(
preparedProducts
.map(x=>x.stock_product_id)
.filter(Boolean)
);

const manualProducts=products.filter(p=>{

const linked=preparedStockIds.has(p.id);

const medialunas=
String(p.name||'')
.trim()
.toLowerCase()==='medialunas';

return !linked && !medialunas;
});

return manualProducts.map(p=>{

const used=Number(shiftUsage[p.id]||0);
const step=Number(p.unit_step||1);

return `

<div class="prod stockrow">

<div>

<b>${esc(p.name)}</b>

<div class="tiny">
Descuenta ${fmt(step)}
${esc(p.unit_label||'unidad')} por toque
</div>

<div class="tiny">
Usado en este turno:
<b>${fmt(used)}</b>
</div>

</div>

<div>

<div class="qty">
${fmt(p.stock_qty)}
</div>

<div class="tiny"
style="text-align:right;margin-bottom:7px">
Stock actual
</div>

<button
class="red"
id="use_${p.id}"
onclick="changeUsage('${p.id}')">
− Restar
</button>

</div>

</div>

`;

}).join('');
}


/* ==========================================
   CARGAR CONSUMO DEL TURNO
   ========================================== */

async function loadShiftUsage(){

if(!shift?.id){
shiftUsage={};
return;
}

const r=await sb
.from('shift_stock')
.select('product_id,used_qty')
.eq('shift_id',shift.id);

if(r.error){
console.error(r.error);
return;
}

shiftUsage={};

(r.data||[]).forEach(x=>{
shiftUsage[x.product_id]=Number(x.used_qty||0);
});

if($('work') && shift){
renderShift();
}
}


/* ==========================================
   EMPLEADA RESTA PRODUCTO
   ========================================== */

async function changeUsage(id){

if(changingUsage)return;

if(!shift?.id){
alert('No hay un turno abierto.');
return;
}

/* Seguridad adicional en frontend */
if(me?.role==='manager'){
alert('Esta función corresponde al turno de empleadas.');
return;
}

const product=products.find(p=>p.id===id);

if(!product){
alert('No se encontró el producto.');
return;
}

changingUsage=true;

const button=$('use_'+id);

if(button){
button.disabled=true;
button.textContent='Guardando...';
}

try{

/*
p_direction = 1 significa:
AGREGAR una unidad al CONSUMO DEL TURNO.

NO suma stock.

El stock real se descuenta cuando
se confirma el cierre del turno.
*/

const r=await sb.rpc(
'adjust_shift_usage',
{
p_product:id,
p_shift:shift.id,
p_direction:1
}
);

if(r.error){
throw r.error;
}

shiftUsage[id]=Number(r.data||0);

renderShift();

}catch(e){

console.error(e);

alert(
'No se pudo registrar el descuento. '+
(e.message||'Intentá nuevamente.')
);

if(button){
button.disabled=false;
button.textContent='− Restar';
}

}finally{

changingUsage=false;

}
}

   ELABORADOS
   ========================================== */

function preparedHTML(){

if(!preparedProducts.length){

return `
<p class="muted">
No hay productos elaborados configurados.
</p>
`;
}

return preparedProducts.map(p=>`

<div class="prepared">

<b>${esc(p.name)}</b>

<p class="tiny">
Completá las cantidades del turno.
La aplicación calcula automáticamente lo vendido.
</p>

<label>
Cantidad que recibís al comenzar
</label>

<input
id="prep_open_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que cocinás durante el turno
</label>

<input
id="prep_made_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que queda al finalizar
</label>

<input
id="prep_close_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<div
class="calc"
id="prep_calc_${p.id}">
Vendidas: —
</div>

<button
class="sec"
onclick="savePreparedProduct('${p.id}')">
Guardar ${esc(p.name)}
</button>

</div>

`).join('');
}

function updatePreparedCalculation(id){

const a=$('prep_open_'+id)?.value;
const b=$('prep_made_'+id)?.value;
const c=$('prep_close_'+id)?.value;

const box=$('prep_calc_'+id);

if(!box)return;

if(a===''||b===''||c===''){

box.textContent='Vendidas: —';

return;
}

const opening=Number(a);
const made=Number(b);
const closing=Number(c);

const sold=opening+made-closing;

if(sold<0){

box.textContent='Revisá las cantidades';

return;
}

box.textContent='Vendidas: '+fmt(sold);
}

async function loadPreparedCounts(){

if(!shift)return;

const r=await sb
.from('prepared_shift_counts')
.select('*')
.eq('shift_id',shift.id);

if(r.error){

console.error(r.error);

return;
}

(r.data||[]).forEach(x=>{

const a=$(
'prep_open_'+x.prepared_product_id
);

const b=$(
'prep_made_'+x.prepared_product_id
);

const c=$(
'prep_close_'+x.prepared_product_id
);

if(a)a.value=x.opening_qty;

if(b)b.value=x.made_qty;

if(c && x.closing_qty!=null){
c.value=x.closing_qty;
}

updatePreparedCalculation(
x.prepared_product_id
);

});
}

async function savePreparedProduct(id){

if(!shift)return;

const opening=
Number(
$('prep_open_'+id)?.value||0
);

const made=
Number(
$('prep_made_'+id)?.value||0
);

const closeValue=
$('prep_close_'+id)?.value;

const closing=
closeValue===''?
null:
Number(closeValue);

const r=await sb
.from('prepared_shift_counts')
.upsert({

shift_id:shift.id,

prepared_product_id:id,

user_id:me.id,

opening_qty:opening,

made_qty:made,

closing_qty:closing,

updated_at:new Date().toISOString()

},{
onConflict:'shift_id,prepared_product_id'
});

if(r.error){

alert(r.error.message);

return;
}

alert('Guardado ✓');
}

async function saveAllPreparedBeforeSummary(){

for(const p of preparedProducts){

const a=$('prep_open_'+p.id);
const b=$('prep_made_'+p.id);
const c=$('prep_close_'+p.id);

if(!a||!b||!c)continue;

if(c.value===''){

throw new Error(
`Completá la cantidad final de ${p.name}.`
);

}

const opening=Number(a.value||0);
const made=Number(b.value||0);
const closing=Number(c.value);

if(opening+made-closing<0){

throw new Error(
`Revisá las cantidades de ${p.name}.`
);

}

const r=await sb
.from('prepared_shift_counts')
.upsert({

shift_id:shift.id,

prepared_product_id:p.id,

user_id:me.id,

opening_qty:opening,

made_qty:made,

closing_qty:closing,

updated_at:new Date().toISOString()

},{
onConflict:'shift_id,prepared_product_id'
});

if(r.error){
throw r.error;
}

}
}

async function closeShift(whole,skim,cash){

if(closingShift||!shift)return;

closingShift=true;

const btn=$('confirmCloseBtn');

if(btn){

btn.disabled=true;

btn.textContent=
'Cerrando turno...';

}

try{

const r=await sb.rpc(
'close_shift_atomic',
{

p_shift:shift.id,

p_whole:Number(whole||0),

p_skim:Number(skim||0),

p_cash:Number(cash||0)

}
);

if(r.error){
throw r.error;
}

const verify=await sb
.from('shifts')
.select('status,closed_at')
.eq('id',shift.id)
.single();

if(verify.error){
throw verify.error;
}

if(verify.data?.status!=='closed'){

throw new Error(
'El cierre no fue confirmado por la base de datos.'
);

}

shift=null;
shiftUsage={};

await loadProducts();

renderHead();

employeeHome();

alert(
'Turno cerrado correctamente ✓'
);

}catch(e){

alert(
'No se pudo cerrar el turno. No se aplicó el cierre. '+
(e.message||'')
);

if(btn){

btn.disabled=false;

btn.textContent=
'Confirmar y cerrar turno';

}

}finally{

closingShift=false;

}
}

async function turnDetail(id){

const [
sr,
mr,
pr,
ur,
nr,
mvr
]=await Promise.all([

sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('id',id)
.single(),

sb
.from('milk_usage')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('prepared_shift_counts')
.select(
'*,prepared_products(name)'
)
.eq('shift_id',id)
.order('updated_at'),

sb
.from('unbilled_items')
.select('*')
.eq('shift_id',id)
.order('created_at'),

sb
.from('shift_notes')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('stock_movements')
.select(
'*,products(name,unit_label)'
)
.eq('shift_id',id)
.order('created_at')

]);

const s=sr.data;

if(!s)return;

const prepared=
pr.data||[];

const preparedText=
prepared.length

?prepared.map(x=>{

const sold=

x.sold_qty!=null

?Number(x.sold_qty)

:

x.closing_qty!=null

?Number(x.opening_qty)
+Number(x.made_qty)
-Number(x.closing_qty)

:null;

return `

<div class="preparedAdmin">

<b>
${esc(
x.prepared_products?.name||
'Elaborado'
)}
</b>

<div class="tiny">

Inicial:
${fmt(x.opening_qty)}

· Cocinadas:
${fmt(x.made_qty)}

· Final:

${x.closing_qty==null
?'—'
:fmt(x.closing_qty)}

</div>

<div style="margin-top:8px">

Vendidas:

<b>
${sold==null
?'—'
:fmt(sold)}
</b>

</div>

</div>

`;

}).join('')

:
'<p class="muted">Sin datos de elaborados.</p>';

const moves=
(mvr.data||[])
.filter(
x=>Number(x.delta)<0
);

const totals={};

moves.forEach(x=>{

const n=
x.products?.name||
'Producto';

totals[n]=
(totals[n]||0)
+
Math.abs(
Number(x.delta)
);

});

$('work').innerHTML=`

<div class="card">

<button
class="sec"
onclick="adminTurns()">
← Volver
</button>

<h2>
${esc(
s.profiles?.full_name||
'Turno'
)}
</h2>

<div class="badge">

${s.kind==='morning'
?'MAÑANA'
:'TARDE'}

·

${s.status==='closed'
?'CERRADO'
:'ABIERTO'}

</div>

<h3>Elaborados</h3>

${preparedText}

<h3>Stock consumido</h3>

${Object.entries(totals)

.map(([n,v])=>`

<div class="item">

${esc(n)}:

<b>${fmt(v)}</b>

</div>

`).join('')

||

'<p class="muted">Sin descuentos.</p>'}

<h3>Leches</h3>

<p>

Entera:

<b>
${fmt(
mr.data?.whole_boxes
)}
</b>

·

Descremada:

<b>
${fmt(
mr.data?.skim_boxes
)}
</b>

</p>

<h3>Sobrante de caja</h3>

<div class="money">
$ ${fmt(s.cash_surplus)}
</div>

<h3>No facturados</h3>

${(ur.data||[])

.map(x=>`

<div class="item">

${esc(x.product_name)}

· código

${esc(x.product_code)}

·

${(x.sold_at||'').slice(0,5)}

</div>

`).join('')

||

'<p class="muted">Ninguno.</p>'}

<h3>Notas</h3>

<p>

${nr.data?.no_notes

?'No hay notas'

:esc(
nr.data?.note||
'Sin cargar'
)}

</p>

</div>
`;
}

   ========================================== */

async function adminAlerts(inDash=false){

const r=await sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('status','closed')
.order(
'closed_at',
{ascending:false}
)
.limit(15);

let alerts=[];

for(const s of (r.data||[])){

if(Number(s.cash_surplus)>0){

alerts.push(`

<div class="alert">

<b>

Diferencia de caja ·

${esc(
s.profiles?.full_name||
''
)}

</b>

<br>

Sobrante:

$ ${fmt(s.cash_surplus)}

</div>

`);

}

}

const cr=await sb
.from('prepared_shift_counts')
.select(
'*,prepared_products(name),shifts(opened_at,status,employee_id,profiles(full_name))'
)
.order(
'updated_at',
{ascending:false}
)
.limit(100);

const grouped={};

(cr.data||[])

.filter(
x=>x.shifts?.status==='closed'
)

.forEach(x=>{

const key=
x.prepared_product_id;

if(!grouped[key]){

grouped[key]=[];

}

grouped[key].push(x);

});

Object.values(grouped)

.forEach(arr=>{

arr.sort(
(a,b)=>
new Date(a.shifts.opened_at)
-
new Date(b.shifts.opened_at)
);

for(
let i=1;
i<arr.length;
i++
){

const prev=arr[i-1];
const cur=arr[i];

if(

prev.closing_qty!=null &&

cur.opening_qty!=null &&

Number(prev.closing_qty)!==
Number(cur.opening_qty)

){

const d=
Number(prev.closing_qty)
-
Number(cur.opening_qty);

alerts.push(`

<div class="alert">

<b>

Diferencia de

${esc(
cur.prepared_products?.name||
'elaborado'
)}

</b>

<br>

${esc(
prev.shifts.profiles?.full_name||
'Turno anterior'
)}

dejó

${fmt(prev.closing_qty)};

${esc(
cur.shifts.profiles?.full_name||
'turno siguiente'
)}

recibió

${fmt(cur.opening_qty)}.

<b>

${d>0
?'Faltan '+fmt(d)
:'Sobran '+fmt(Math.abs(d))}

</b>

</div>

`);

}

}

});

const html=
alerts.join('')

||

'<div class="okbox">No hay alertas pendientes en los últimos cierres.</div>';

if(inDash){

const d=$('dash');

if(d){

d.innerHTML=`

<div class="card">

<h2>Alertas recientes</h2>

${html}

</div>

`;

}

}else{

$('work').innerHTML=`

<div class="card">

<h2>Alertas</h2>

${html}

</div>

`;

}

}
