<script>

const sb=supabase.createClient(
'https://eodbrfdzaizopiihuryz.supabase.co',
'sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo'
);

let me=null;
let shift=null;
let products=[];
let preparedProducts=[];

const $=x=>document.getElementById(x);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

const fmt=n=>Number(n||0).toLocaleString('es-AR');

async function login(){
const r=await sb.auth.signInWithPassword({
email:$('email').value,
password:$('pass').value
});

if(r.error)return $('msg').textContent=r.error.message;

boot();
}

async function logout(){
await sb.auth.signOut();
location.reload();
}

async function boot(){

try{
await sb.rpc('close_expired_shifts');
}catch(e){}

const u=(await sb.auth.getUser()).data.user;

if(!u)return;

$('auth').classList.add('hide');
$('home').classList.remove('hide');

me=(await sb
.from('profiles')
.select('*')
.eq('id',u.id)
.single()).data;

if(!me)return alert('Tu perfil todavía no está disponible.');

await loadProducts();
await loadPreparedProducts();

shift=(await sb
.from('shifts')
.select('*')
.eq('employee_id',u.id)
.eq('status','open')
.maybeSingle()).data;

$('hello').textContent='Hola, '+me.full_name;

renderHead();

me.role==='manager'
?adminHome()
:shift
?renderShift()
:employeeHome();
}

function renderHead(){

const admin=me.role==='manager';

$('head').innerHTML=`
<span class="badge">${admin?'ADMINISTRACIÓN':'EMPLEADA'}</span>

<h2>${esc(me.full_name)}</h2>

${admin?`
<div class="nav">
<button onclick="adminHome()">Inicio</button>
<button class="sec" onclick="adminStock()">Stock</button>
<button class="sec" onclick="adminTurns()">Turnos</button>
</div>
`:
`${shift?'<div class="okbox">Turno abierto · podés salir y volver cuando quieras.</div>':''}`
}

<button class="ghost" onclick="logout()">Cerrar sesión</button>
`;
}

.select('*')
.eq('active',true)
.order('sort_order')).data||[];
}

async function loadPreparedProducts(){

.select('*')
.eq('active',true)
.order('sort_order')).data||[];
}

Mañana: 07:00 a 15:15 ·

`;
}

}

</p>

id="prep_close_${p.id}"

step="1"

</p>

<input
id="uc"

<input
id="ut"
type="time">

<button
class="sec"

</button>

Si no hubo diferencia, poné 0.
</p>

<input
id="cash"
type="number"
step="0.01"

<button

onclick="saveCash()">

<h3>Notas</h3>

<input

loadMilk();
loadPreparedCounts();
loadUnbilled();

async function take(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const qty=Number(p.unit_step||1);

if(!confirm(
`¿Descontar ${fmt(qty)} ${p.unit_label||'unidad'} de ${p.name} del stock?`
))return;

const r=await sb.rpc('decrement_stock',{
p_product:id,
p_shift:shift?.id||null
});

if(r.error)return alert(r.error.message);

await loadProducts();

renderShift();
}

/* ================================
   ELABORADOS
================================ */

function updatePreparedCalculation(id){

const a=$('prep_open_'+id)?.value;
const b=$('prep_made_'+id)?.value;
const c=$('prep_close_'+id)?.value;

const box=$('prep_calc_'+id);

if(!box)return;

if(a===''||b===''||c===''){
box.textContent='Vendidas: —';
return;
}

const opening=Number(a);
const made=Number(b);
const closing=Number(c);

const sold=opening+made-closing;

if(sold<0){
box.textContent='Revisá las cantidades';
return;
}

box.textContent='Vendidas: '+fmt(sold);
}

async function loadPreparedCounts(){

if(!shift)return;

const r=await sb
.from('prepared_shift_counts')
.select('*')
.eq('shift_id',shift.id);

if(r.error){
console.error(r.error);
return;
}

(r.data||[]).forEach(x=>{

const a=$('prep_open_'+x.prepared_product_id);
const b=$('prep_made_'+x.prepared_product_id);
const c=$('prep_close_'+x.prepared_product_id);

if(a)a.value=x.opening_qty??'';
if(b)b.value=x.made_qty??'';
if(c)c.value=x.closing_qty??'';

updatePreparedCalculation(x.prepared_product_id);
});
}

async function savePreparedProduct(id,required=false){

const ao=$('prep_open_'+id);
const bm=$('prep_made_'+id);
const cc=$('prep_close_'+id);

if(!ao||!bm||!cc)return true;

const av=ao.value;
const bv=bm.value;
const cv=cc.value;

if(av===''||bv===''){

if(required){
alert('Completá la cantidad inicial y lo elaborado durante el turno.');
return false;
}

return true;
}

const opening=Number(av);
const made=Number(bv);

const closing=cv===''?null:Number(cv);

if(
!Number.isInteger(opening)||
opening<0||
!Number.isInteger(made)||
made<0
){
alert('Las cantidades de elaborados deben ser números enteros.');
return false;
}

if(required && closing===null){
alert('Completá cuánto queda de cada elaborado antes de cerrar el turno.');
return false;
}

if(
closing!==null &&
(!Number.isInteger(closing)||closing<0)
){
alert('La cantidad final no es válida.');
return false;
}

if(
closing!==null &&
closing>opening+made
){
alert('La cantidad final no puede ser mayor que lo recibido más lo elaborado.');
return false;
}

const r=await sb
.from('prepared_shift_counts')
.upsert(
{
shift_id:shift.id,
prepared_product_id:id,
user_id:me.id,
opening_qty:opening,
made_qty:made,
closing_qty:closing,
updated_at:new Date().toISOString()
},
{
onConflict:'shift_id,prepared_product_id'
}
);

if(r.error){
alert(r.error.message);
return false;
}

updatePreparedCalculation(id);

if($('status')){
$('status').textContent='Elaborados guardados ✓';
}

return true;
}

async function saveAllPrepared(required=false){

for(const p of preparedProducts){

const ok=await savePreparedProduct(p.id,required);

if(!ok)return false;
}

return true;
}

/* ================================
   LECHES
================================ */

async function saveMilk(){

const r=await sb
.from('milk_usage')
.upsert({
shift_id:shift.id,

});

if(r.error)return alert(r.error.message);

$('status').textContent='Leches guardadas ✓';
}

async function loadMilk(){

const r=await sb
.from('milk_usage')
.select('*')
.eq('shift_id',shift.id)
.maybeSingle();

if(r.data){

$('milk_whole').value=r.data.whole_boxes;
$('milk_skim').value=r.data.skim_boxes;

}

/* ================================
   CAJA
================================ */

async function saveCash(){

const v=Number($('cash').value||0);

const r=await sb
.from('shifts')
.update({
cash_surplus:v
})
.eq('id',shift.id);

if(r.error)return alert(r.error.message);

shift.cash_surplus=v;

/* ================================
   NO FACTURADOS
================================ */

async function addUnbilled(){

if(
!$('un').value.trim()||
!$('uc').value.trim()||
!$('ut').value
){
return alert('Completá nombre, código y hora.');
}

const r=await sb
.from('unbilled_items')
.insert({
shift_id:shift.id,
created_by:me.id,
product_name:$('un').value.trim(),
product_code:$('uc').value.trim(),
sold_at:$('ut').value,
quantity:1,
unit_price:0
});

if(r.error)return alert(r.error.message);

$('un').value='';
$('uc').value='';
$('ut').value='';

loadUnbilled();
}

async function loadUnbilled(){

const r=await sb
.from('unbilled_items')
.select('*')
.eq('shift_id',shift.id)
.order('created_at');

$('unlist').innerHTML=(r.data||[])
.map(x=>`

<div class="item">
<b>${esc(x.product_name)}</b>
· Código ${esc(x.product_code)}
· ${esc((x.sold_at||'').slice(0,5))}
</div>

`).join('')
||
'<p class="muted">Sin productos no facturados.</p>';
}

/* ================================
   NOTAS
================================ */

function toggleNotes(){

const n=$('nonotes').checked;

$('note').disabled=n;

if(n)$('note').value='';
}

async function saveNotes(){

const r=await sb
.from('shift_notes')
.upsert({
shift_id:shift.id,
user_id:me.id,
note:$('note').value.trim()||null,
no_notes:$('nonotes').checked,
updated_at:new Date().toISOString()
});

if(r.error)return alert(r.error.message);
}

async function loadNotes(){

const r=await sb
.from('shift_notes')
.select('*')
.eq('shift_id',shift.id)
.maybeSingle();

if(r.data){

$('note').value=r.data.note||'';
$('nonotes').checked=!!r.data.no_notes;

toggleNotes();
}
}

/* ================================
   CERRAR TURNO
================================ */

async function closeShift(){

if(
$('milk_whole').value===''||
$('milk_skim').value===''
){
return alert(
'Completá las leches utilizadas antes de cerrar el turno. Si no usaron, poné 0.'
);
}

await saveMilk();
await saveCash();

const preparedOK=await saveAllPrepared(true);

if(!preparedOK)return;

await saveNotes();

if(!confirm(
'¿Confirmás cerrar el turno? Se calcularán automáticamente los elaborados vendidos.'
))return;


/* Calcula vendidos y descuenta del stock */

const calc=await sb.rpc(
'finalize_prepared_sales',
{
p_shift:shift.id
}
);

if(calc.error){
return alert(
'No se pudo calcular el stock de elaborados: '+calc.error.message
);
}


/* Cierra el turno */

const r=await sb
.from('shifts')
.update({
status:'closed',
closed_at:new Date().toISOString()
})
.eq('id',shift.id);

if(r.error)return alert(r.error.message);

shift=null;

await loadProducts();

alert(
'Turno cerrado. Los elaborados vendidos se calcularon y descontaron automáticamente.'
);

renderHead();
employeeHome();
}

async function addStock(id){

const v=Number($('add'+id).value||0);

if(!v||v<=0)
return alert('Ingresá una cantidad válida');

const r=await sb.rpc(
'manager_adjust_stock',
{
p_product:id,
p_delta:v
}
);

if(r.error)return alert(r.error.message);

$('add'+id).value='';

await loadProducts();

adminStock();
}

async function discountStock(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const v=Number($('add'+id).value||0);

if(!v||v<=0)
return alert('Ingresá la cantidad que querés descontar');

if(!confirm(
`¿Descontar ${fmt(v)} ${p.unit_label||'unidad'} de ${p.name} del stock?`
))return;

const r=await sb.rpc(
'manager_adjust_stock',
{
p_product:id,
p_delta:-v
}
);

if(r.error)return alert(r.error.message);

$('add'+id).value='';

await loadProducts();

adminStock();
}

'manager_create_product',
{
p_name:n,
p_stock:Number($('ps').value||0),

}
);

async function deactivateProduct(id,name){

if(!confirm(
`¿Desactivar ${name}? No se borra su historial.`
))return;

const r=await sb.rpc(
'manager_set_product_active',
{
p_id:id,
p_active:false
}
);

if(r.error)return alert(r.error.message);

await loadProducts();

adminProducts();
}

async function turnDetail(id){

const [
sr,
mr,
pr,
ur,
nr,
mvr
]=await Promise.all([

sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('id',id)
.single(),

sb
.from('milk_usage')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('prepared_shift_counts')
.select('*,prepared_products(name)')
.eq('shift_id',id)
.order('updated_at'),

sb
.from('unbilled_items')
.select('*')
.eq('shift_id',id)
.order('created_at'),

sb
.from('shift_notes')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('stock_movements')
.select('*,products(name,unit_label)')
.eq('shift_id',id)
.order('created_at')

]);

const s=sr.data;

if(!s)return;

const moves=(mvr.data||[])
.filter(x=>Number(x.delta)<0);

const totals={};

moves.forEach(x=>{

const n=x.products?.name||'Producto';

totals[n]=(totals[n]||0)
+Math.abs(Number(x.delta));
});

const prepared=(pr.data||[]);

const preparedText=prepared.length
?prepared.map(x=>`

<div class="item">

<b>${esc(x.prepared_products?.name||'Elaborado')}</b>

<div class="tiny">

Inicial:
${fmt(x.opening_qty)}

· Hechas:
${fmt(x.made_qty)}

· Final:
${x.closing_qty==null?'—':fmt(x.closing_qty)}

</div>

<div>
Vendidas:
<b>
${x.sold_qty==null
?'—'
:fmt(x.sold_qty)}
</b>
</div>

</div>

`).join('')
:'<p class="muted">Sin datos de elaborados.</p>';

$('work').innerHTML=`

<div class="card">

<button
class="sec"
onclick="adminTurns()">
← Volver
</button>

<h2>
${esc(s.profiles?.full_name||'Turno')}
</h2>

<div class="badge">

${s.kind==='morning'?'MAÑANA':'TARDE'}
·
${s.status==='closed'?'CERRADO':'ABIERTO'}

</div>


<h3>Sobrante de caja</h3>

<div class="money">
$ ${fmt(s.cash_surplus)}
</div>


<h3>Stock consumido</h3>

${Object.entries(totals)
.map(([n,v])=>`

<div class="item">
${esc(n)}:
<b>${fmt(v)}</b>
</div>

`).join('')
||
'<p class="muted">Sin descuentos.</p>'}


<h3>Leches</h3>

<p>
Entera:
<b>${fmt(mr.data?.whole_boxes)}</b>
·
Descremada:
<b>${fmt(mr.data?.skim_boxes)}</b>
</p>

<p class="muted">
Cafés estimados: pendiente de definir la proporción.
</p>


<h3>Elaborados</h3>

${preparedText}


<h3>No facturados</h3>

${(ur.data||[])
.map(x=>`

<div class="item">

${esc(x.product_name)}
· código
${esc(x.product_code)}
·
${(x.sold_at||'').slice(0,5)}

</div>

`).join('')
||
'<p class="muted">Ninguno.</p>'}


<h3>Notas</h3>

<p>
${nr.data?.no_notes
?'No hay notas'
:esc(nr.data?.note||'Sin cargar')}
</p>

</div>
`;
}

/* ================================
   ALERTAS
================================ */

async function adminAlerts(inDash=false){

const r=await sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('status','closed')
.order('closed_at',{ascending:false})
.limit(15);

let alerts=[];

for(const s of (r.data||[])){

if(Number(s.cash_surplus)>0){

alerts.push(`

<div class="alert">

<b>
Diferencia de caja ·
${esc(s.profiles?.full_name||'')}
</b>

<br>

Sobrante:
$ ${fmt(s.cash_surplus)}

</div>

`);
}
}

/* diferencias entre cierre de un turno e inicio del siguiente */

const cr=await sb
.from('prepared_shift_counts')
.select('*,prepared_products(name),shifts(opened_at,status,employee_id,profiles(full_name))')
.order('updated_at',{ascending:false})
.limit(100);

const grouped={};

(cr.data||[])
.filter(x=>x.shifts?.status==='closed')
.forEach(x=>{

const key=x.prepared_product_id;

if(!grouped[key])grouped[key]=[];

grouped[key].push(x);
});

Object.values(grouped).forEach(arr=>{

arr.sort(
(a,b)=>
new Date(a.shifts.opened_at)
-
new Date(b.shifts.opened_at)
);

for(let i=1;i<arr.length;i++){

const prev=arr[i-1];
const cur=arr[i];

if(
prev.closing_qty!=null &&
cur.opening_qty!=null &&
Number(prev.closing_qty)!==Number(cur.opening_qty)
){

const d=
Number(prev.closing_qty)
-
Number(cur.opening_qty);

alerts.push(`

<div class="alert">

<b>
Diferencia de
${esc(cur.prepared_products?.name||'elaborado')}
</b>

<br>

${esc(prev.shifts.profiles?.full_name||'Turno anterior')}
dejó
${fmt(prev.closing_qty)};

${esc(cur.shifts.profiles?.full_name||'turno siguiente')}
recibió
${fmt(cur.opening_qty)}.

<b>
${d>0
?'Faltan '+fmt(d)
:'Sobran '+fmt(Math.abs(d))}
</b>.

</div>

`);
}
}
});

const html=
alerts.join('')
||
'<div class="okbox">No hay alertas pendientes en los últimos cierres.</div>';

if(inDash){

const d=$('dash');

if(d)d.innerHTML=`

<div class="card">

<h2>Alertas recientes</h2>

${html}

</div>
`;

}else{

$('work').innerHTML=`

<div class="card">

<h2>Alertas</h2>

${html}

</div>
`;
}
}
