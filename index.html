<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>YPF TRES SOLES FULL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3faff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}#app{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="/legacy-index.html?v=20261029-yieldfix"></iframe><script>
const root=document.getElementById('app');function goExpiry(){root.src='/expiry.html?v=20261029-yieldfix'}function goYield(){try{const od=root.contentDocument,inner=od&&od.getElementById('app');if(inner){inner.src='/rendimientos.html?v=20261029-yieldfix';return}}catch(e){}root.src='/rendimientos.html?v=20261029-yieldfix'}
function inject(){try{const od=root.contentDocument;if(!od)return;const inner=od.getElementById('app');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument;const home=d.getElementById('home');if(!home||home.classList.contains('hide'))return;const badge=(d.querySelector('#head .badge')?.textContent||'').trim().toUpperCase();const isAdmin=badge.includes('ADMINISTRACIÓN');if(isAdmin){const nav=d.querySelector('#head .nav');if(nav){nav.style.gridTemplateColumns='repeat(2,1fr)';if(!d.getElementById('expiryAdminTop')){const b=d.createElement('button');b.id='expiryAdminTop';b.className='sec';b.textContent='📅 Vencimientos';b.onclick=goExpiry;nav.appendChild(b)}if(!d.getElementById('yieldAdminTop')){const b=d.createElement('button');b.id='yieldAdminTop';b.className='sec';b.textContent='📦 Rendimientos';b.onclick=goYield;nav.appendChild(b)}}}else{const work=d.getElementById('work');const card=work&&work.querySelector('.card');if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#1979a8;margin-bottom:6px">📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button type="button" style="margin:0">Abrir vencimientos</button>';box.querySelector('button').onclick=goExpiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error('UI',e)}}setInterval(inject,350);root.addEventListener('load',()=>setTimeout(inject,500));
</script></body></html>
