<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><link rel="manifest" href="manifest.webmanifest"><title>YPF FULL 6</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:white;padding:27px 20px 23px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{font-size:13px;padding:12px 6px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.red{background:#c84c45}.ghost{background:#f7fcff;color:#1979a8;border:1px solid #c9eafa}.green{background:#16875d}.hide{display:none}.muted,.tiny{font-size:13px;color:#6c8794}.tiny{font-size:12px}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}.prod{padding:13px 0;border-top:1px solid #e8f3f8}.stockrow{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px}.qty{font-size:22px;font-weight:800;text-align:right}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}input,textarea,select{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px;background:#fff}textarea{min-height:85px}h2{margin:7px 0 12px}h3{margin-top:23px}.item{padding:10px 0;border-bottom:1px solid #edf5f9}.alert{background:#fff7e7;border:1px solid #f0d49a;padding:12px;border-radius:14px;margin:8px 0}.okbox{background:#edf9f3;border:1px solid #cbe9d8;padding:12px;border-radius:14px}.money{font-size:24px;font-weight:800}.click{cursor:pointer}
</style></head><body><header class="top"><b>YPF FULL 6</b><div id="hello" style="margin-top:5px;opacity:.9">Control de stock</div></header><main class="wrap"><section id="auth" class="card"><h2>Ingresar</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Ingresar</button><p id="msg" class="muted">Cada persona ingresa con su propia cuenta.</p></section><section id="home" class="hide"><div id="head" class="card"></div><div id="work"></div></section></main><script>
const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');let me=null,shift=null,products=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>Number(n||0).toLocaleString('es-AR');
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)return $('msg').textContent=r.error.message;boot()}async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){try{await sb.rpc('close_expired_shifts')}catch(e){}const u=(await sb.auth.getUser()).data.user;if(!u)return;$('auth').classList.add('hide');$('home').classList.remove('hide');me=(await sb.from('profiles').select('*').eq('id',u.id).single()).data;if(!me)return alert('Tu perfil todavía no está disponible.');await loadProducts();shift=(await sb.from('shifts').select('*').eq('employee_id',u.id).eq('status','open').maybeSingle()).data;$('hello').textContent='Hola, '+me.full_name;renderHead();me.role==='manager'?adminHome():shift?renderShift():employeeHome()}
function renderHead(){const admin=me.role==='manager';$('head').innerHTML=`<span class="badge">${admin?'ADMINISTRACIÓN':'EMPLEADA'}</span><h2>${esc(me.full_name)}</h2>${admin?`<div class="nav"><button onclick="adminHome()">Inicio</button><button class="sec" onclick="adminStock()">Stock</button><button class="sec" onclick="adminTurns()">Turnos</button></div>`:`${shift?'<div class="okbox">Turno abierto · podés salir y volver cuando quieras.</div>':''}`}<button class="ghost" onclick="logout()">Cerrar sesión</button>`}
async function loadProducts(){products=(await sb.from('products').select('*').eq('active',true).order('sort_order')).data||[]}
function employeeHome(){$('work').innerHTML=`<div class="card"><h2>Mi turno</h2><p class="muted">Mañana: 07:00 a 15:15 · Tarde: 15:15 a 22:15. Solo puede haber una empleada con el turno abierto. Si no lo cerrás antes, se cierra automáticamente al terminar el horario.</p><button onclick="openShift('morning')">Abrir turno Mañana</button><button onclick="openShift('afternoon')">Abrir turno Tarde</button></div>`}
async function openShift(kind){if(shift)return renderShift();const r=await sb.from('shifts').insert({employee_id:me.id,kind}).select().single();if(r.error)return alert(r.error.message);shift=r.data;renderHead();renderShift()}
function employeeStock(){return products.map(p=>`<div class="prod stockrow"><div><b>${esc(p.name)}</b><div class="tiny">Descuenta ${p.unit_step} ${esc(p.unit_label)}</div></div><div><div class="qty" id="q${p.id}">${fmt(p.stock_qty)}</div><button onclick="take('${p.id}')">− Descontar</button></div></div>`).join('')}
function renderShift(){$('work').innerHTML=`<div class="card"><h2>${shift.kind==='morning'?'Turno Mañana':'Turno Tarde'}</h2><p class="muted">El turno permanece abierto durante toda la jornada. Solo podés descontar stock.</p><h3>Stock</h3>${employeeStock()}<h3>Leches utilizadas</h3><div class="row"><div><label>Entera</label><input id="milk_whole" type="number" min="0" step="0.5" placeholder="0"></div><div><label>Descremada</label><input id="milk_skim" type="number" min="0" step="0.5" placeholder="0"></div></div><button class="sec" onclick="saveMilk()">Guardar leches</button><h3>Medialunas</h3><label>Hechas que recibís al llegar</label><input id="cro_open" type="number" min="0" step="1"><label>Hechas durante el turno</label><input id="cro_made" type="number" min="0" step="1"><label>Hechas que dejás al turno siguiente</label><input id="cro_close" type="number" min="0" step="1"><button class="sec" onclick="saveCroissants()">Guardar medialunas</button><h3>Productos no facturados</h3><input id="un" placeholder="Nombre del producto"><input id="uc" placeholder="Código del producto"><input id="ut" type="time"><button class="sec" onclick="addUnbilled()">Agregar no facturado</button><div id="unlist"></div><h3>Sobrante de caja</h3><p class="muted">Anotá cuánto dinero sobró. Si no hubo diferencia, poné 0.</p><input id="cash" type="number" step="0.01" min="0" placeholder="$ 0"><button class="sec" onclick="saveCash()">Guardar sobrante</button><h3>Notas</h3><textarea id="note" placeholder="Observaciones del turno..."></textarea><label><input id="nonotes" type="checkbox" style="width:auto" onchange="toggleNotes()"> No hay notas</label><button class="sec" onclick="saveNotes()">Guardar notas</button><button class="red" onclick="closeShift()">Cerrar turno</button><p id="status" class="muted"></p></div>`;loadMilk();loadCroissants();loadUnbilled();loadNotes();$('cash').value=shift.cash_surplus||0}
async function take(id){const p=products.find(x=>x.id===id);const r=await sb.rpc('decrement_stock',{p_product:id,p_shift:shift.id});if(r.error)return alert(r.error.message);p.stock_qty=r.data;$('q'+id).textContent=fmt(r.data);$('status').textContent='Descontado: '+p.name+' ✓'}
async function saveMilk(){const r=await sb.from('milk_usage').upsert({shift_id:shift.id,whole_boxes:Number($('milk_whole').value||0),skim_boxes:Number($('milk_skim').value||0),updated_at:new Date().toISOString()});if(r.error)return alert(r.error.message);$('status').textContent='Leches guardadas ✓'}async function loadMilk(){const r=await sb.from('milk_usage').select('*').eq('shift_id',shift.id).maybeSingle();if(r.data){$('milk_whole').value=r.data.whole_boxes;$('milk_skim').value=r.data.skim_boxes}}
async function saveCash(){const v=Number($('cash').value||0);const r=await sb.from('shifts').update({cash_surplus:v}).eq('id',shift.id);if(r.error)return alert(r.error.message);shift.cash_surplus=v;$('status').textContent='Sobrante de caja guardado ✓'}
async function addUnbilled(){if(!$('un').value.trim()||!$('uc').value.trim()||!$('ut').value)return alert('Completá nombre, código y hora.');const r=await sb.from('unbilled_items').insert({shift_id:shift.id,created_by:me.id,product_name:$('un').value.trim(),product_code:$('uc').value.trim(),sold_at:$('ut').value,quantity:1,unit_price:0});if(r.error)return alert(r.error.message);$('un').value=$('uc').value=$('ut').value='';loadUnbilled()}async function loadUnbilled(){const r=await sb.from('unbilled_items').select('*').eq('shift_id',shift.id).order('created_at');$('unlist').innerHTML=(r.data||[]).map(x=>`<div class="item"><b>${esc(x.product_name)}</b> · Código ${esc(x.product_code)} · ${esc((x.sold_at||'').slice(0,5))}</div>`).join('')||'<p class="muted">Sin productos no facturados.</p>'}
async function loadCroissants(){const r=await sb.from('croissant_shift_counts').select('*').eq('shift_id',shift.id).maybeSingle();if(r.data){$('cro_open').value=r.data.opening_qty??'';$('cro_made').value=r.data.made_qty??'';$('cro_close').value=r.data.closing_qty??''}}async function saveCroissants(req=false){const a=Number($('cro_open').value),b=Number($('cro_made').value),v=$('cro_close').value,c=v===''?null:Number(v);if(!Number.isInteger(a)||a<0||!Number.isInteger(b)||b<0)return alert('Completá medialunas recibidas y hechas.');if(req&&(c===null||!Number.isInteger(c)||c<0))return alert('Anotá cuántas medialunas dejás al siguiente turno.');const r=await sb.from('croissant_shift_counts').upsert({shift_id:shift.id,user_id:me.id,opening_qty:a,made_qty:b,closing_qty:c,updated_at:new Date().toISOString()});if(r.error){alert(r.error.message);return false}return true}
function toggleNotes(){const n=$('nonotes').checked;$('note').disabled=n;if(n)$('note').value=''}async function saveNotes(){const r=await sb.from('shift_notes').upsert({shift_id:shift.id,user_id:me.id,note:$('note').value.trim()||null,no_notes:$('nonotes').checked,updated_at:new Date().toISOString()});if(r.error)return alert(r.error.message)}async function loadNotes(){const r=await sb.from('shift_notes').select('*').eq('shift_id',shift.id).maybeSingle();if(r.data){$('note').value=r.data.note||'';$('nonotes').checked=!!r.data.no_notes;toggleNotes()}}
async function closeShift(){if($('milk_whole').value===''||$('milk_skim').value==='')return alert('Completá las leches utilizadas antes de cerrar el turno. Si no usaron, poné 0.');await saveMilk();await saveCash();if(!await saveCroissants(true))return;await saveNotes();if(!confirm('¿Confirmás cerrar el turno?'))return;const r=await sb.from('shifts').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',shift.id);if(r.error)return alert(r.error.message);shift=null;alert('Turno cerrado. Administración ya puede ver el resumen.');renderHead();employeeHome()}
function adminHome(){$('work').innerHTML=`<div class="card"><h2>Panel de Administración</h2><p class="muted">Abril y Fabio tienen exactamente los mismos permisos.</p><div class="grid"><button onclick="adminStock()">Cargar stock</button><button onclick="adminProducts()">Productos</button><button onclick="adminTurns()">Turnos</button><button onclick="adminAlerts()">Alertas</button></div></div><div id="dash"></div>`;adminAlerts(true)}
function adminStock(){$('work').innerHTML=`<div class="card"><h2>Cargar stock</h2><p class="muted">Ingresá lo que llegó. Al confirmar, se SUMA al stock actual.</p>${products.map(p=>`<div class="prod"><b>${esc(p.name)}</b><div class="tiny">Stock actual: ${fmt(p.stock_qty)} · ${esc(p.unit_label)}</div><div class="row"><input id="add${p.id}" type="number" min="0" step="${p.unit_step}" placeholder="Cantidad que ingresa"><button onclick="addStock('${p.id}')">+ Cargar</button></div></div>`).join('')}<button class="green" onclick="adminHome()">Cerrar carga de stock</button></div>`}
async function addStock(id){const v=Number($('add'+id).value);if(!(v>0))return alert('Ingresá una cantidad mayor a 0.');const r=await sb.rpc('manager_adjust_stock',{p_product:id,p_delta:v});if(r.error)return alert(r.error.message);const p=products.find(x=>x.id===id);p.stock_qty=r.data;$('add'+id).value='';alert(`${p.name}: +${v} cargado. Stock: ${r.data}`);adminStock()}
function adminProducts(){$('work').innerHTML=`<div class="card"><h2>Administrar productos</h2><button onclick="newProductForm()">+ Nuevo producto</button>${products.map(p=>`<div class="prod"><b>${esc(p.name)}</b><div class="tiny">Stock ${fmt(p.stock_qty)} · descuenta ${p.unit_step} ${esc(p.unit_label)}</div><button class="red" onclick="deactivateProduct('${p.id}','${esc(p.name)}')">Eliminar / desactivar</button></div>`).join('')}</div>`}
function newProductForm(){$('work').innerHTML=`<div class="card"><h2>Nuevo producto</h2><label>Nombre</label><input id="pn" placeholder="Ej: Cuabatta Plus"><label>Stock inicial</label><input id="ps" type="number" min="0" step="0.5" value="0"><label>Cantidad que descuenta cada toque</label><input id="pst" type="number" min="0.01" step="0.5" value="1"><label>Unidad</label><input id="pu" value="unidad" placeholder="unidad / media palta / porción"><button onclick="createProduct()">Crear producto</button><button class="sec" onclick="adminProducts()">Cancelar</button></div>`}async function createProduct(){const n=$('pn').value.trim();if(!n)return alert('Poné el nombre.');const r=await sb.rpc('manager_create_product',{p_name:n,p_stock:Number($('ps').value||0),p_step:Number($('pst').value||1),p_unit:$('pu').value.trim()||'unidad'});if(r.error)return alert(r.error.message);await loadProducts();alert('Producto creado ✓');adminProducts()}async function deactivateProduct(id,name){if(!confirm(`¿Desactivar ${name}? No se borra su historial.`))return;const r=await sb.rpc('manager_set_product_active',{p_id:id,p_active:false});if(r.error)return alert(r.error.message);await loadProducts();adminProducts()}
async function adminTurns(){const r=await sb.from('shifts').select('*,profiles(full_name)').order('opened_at',{ascending:false}).limit(80);$('work').innerHTML=`<div class="card"><h2>Turnos</h2>${(r.data||[]).map(s=>`<div class="prod click" onclick="turnDetail('${s.id}')"><b>${esc(s.profiles?.full_name||'Empleado')}</b> · ${s.kind==='morning'?'Mañana':'Tarde'}<div class="tiny">${new Date(s.opened_at).toLocaleString('es-AR')} · ${s.status==='closed'?'Cerrado':'ABIERTO'}</div></div>`).join('')||'<p class="muted">Sin turnos.</p>'}</div>`}
async function turnDetail(id){const [sr,mr,cr,ur,nr,mvr]=await Promise.all([sb.from('shifts').select('*,profiles(full_name)').eq('id',id).single(),sb.from('milk_usage').select('*').eq('shift_id',id).maybeSingle(),sb.from('croissant_shift_counts').select('*').eq('shift_id',id).maybeSingle(),sb.from('unbilled_items').select('*').eq('shift_id',id).order('created_at'),sb.from('shift_notes').select('*').eq('shift_id',id).maybeSingle(),sb.from('stock_movements').select('*,products(name,unit_label)').eq('shift_id',id).order('created_at')]);const s=sr.data;
const moves=(mvr.data||[]).filter(x=>Number(x.delta)<0);const totals={};moves.forEach(x=>{const n=x.products?.name||'Producto';totals[n]=(totals[n]||0)+Math.abs(Number(x.delta))});const c=cr.data;let cro='Sin datos';if(c)cro=`Recibió ${c.opening_qty} · Hizo ${c.made_qty} · Dejó ${c.closing_qty??'—'} · Vendidas estimadas ${c.closing_qty==null?'—':c.opening_qty+c.made_qty-c.closing_qty}`;$('work').innerHTML=`<div class="card"><button class="sec" onclick="adminTurns()">← Volver</button><h2>${esc(s.profiles?.full_name||'Turno')}</h2><div class="badge">${s.kind==='morning'?'MAÑANA':'TARDE'} · ${s.status==='closed'?'CERRADO':'ABIERTO'}</div><h3>Sobrante de caja</h3><div class="money">$ ${fmt(s.cash_surplus)}</div><h3>Stock consumido</h3>${Object.entries(totals).map(([n,v])=>`<div class="item">${esc(n)}: <b>${fmt(v)}</b></div>`).join('')||'<p class="muted">Sin descuentos.</p>'}<h3>Leches</h3><p>Entera: <b>${fmt(mr.data?.whole_boxes)}</b> · Descremada: <b>${fmt(mr.data?.skim_boxes)}</b></p><p class="muted">Cafés estimados: pendiente de definir la proporción.</p><h3>Medialunas</h3><p>${cro}</p><h3>No facturados</h3>${(ur.data||[]).map(x=>`<div class="item">${esc(x.product_name)} · código ${esc(x.product_code)} · ${(x.sold_at||'').slice(0,5)}</div>`).join('')||'<p class="muted">Ninguno.</p>'}<h3>Notas</h3><p>${nr.data?.no_notes?'No hay notas':esc(nr.data?.note||'Sin cargar')}</p></div>`}
async function adminAlerts(inDash=false){const r=await sb.from('shifts').select('*,profiles(full_name)').eq('status','closed').order('closed_at',{ascending:false}).limit(15);let alerts=[];for(const s of (r.data||[])){if(Number(s.cash_surplus)>0)alerts.push(`<div class="alert"><b>Diferencia de caja · ${esc(s.profiles?.full_name||'')}</b><br>Sobrante: $ ${fmt(s.cash_surplus)}</div>`)}const cr=await sb.from('croissant_shift_counts').select('*,shifts(opened_at,status,employee_id,profiles(full_name))').order('updated_at',{ascending:false}).limit(30);const arr=(cr.data||[]).filter(x=>x.shifts?.status==='closed').sort((a,b)=>new Date(a.shifts.opened_at)-new Date(b.shifts.opened_at));for(let i=1;i<arr.length;i++){const prev=arr[i-1],cur=arr[i];if(prev.closing_qty!=null&&cur.opening_qty!=null&&prev.closing_qty!==cur.opening_qty){const d=prev.closing_qty-cur.opening_qty;alerts.push(`<div class="alert"><b>Diferencia de medialunas</b><br>${esc(prev.shifts.profiles?.full_name||'Turno anterior')} dejó ${prev.closing_qty}; ${esc(cur.shifts.profiles?.full_name||'turno siguiente')} recibió ${cur.opening_qty}. <b>${d>0?'Faltan '+d:'Sobran '+Math.abs(d)}</b>.</div>`)}}const html=alerts.join('')||'<div class="okbox">No hay alertas pendientes en los últimos cierres.</div>';if(inDash){const d=$('dash');if(d)d.innerHTML=`<div class="card"><h2>Alertas recientes</h2>${html}</div>`}else $('work').innerHTML=`<div class="card"><h2>Alertas</h2>${html}</div>`}
setInterval(async()=>{if(!me||me.role==='manager'||!shift)return;try{await sb.rpc('close_expired_shifts');const r=await sb.from('shifts').select('*').eq('id',shift.id).single();if(r.data?.status==='closed'){shift=null;alert('El turno se cerró automáticamente porque terminó el horario.');renderHead();employeeHome()}}catch(e){}},60000);boot();</script></body></html>
