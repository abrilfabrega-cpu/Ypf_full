<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>YPF SANTA TERESITA FULL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3faff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}#app{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app"></iframe><script>const root=document.getElementById('app');async function loadApp(){let h=await(await fetch('/legacy-index.html?v=20261029-insumos-visible',{cache:'no-store'})).text();h=h.replaceAll('YPF TRES SOLES FULL','YPF SANTA TERESITA FULL').replace('src="app.html"','src="/santa-core-loader.html?v=20261029-insumos-visible"');root.srcdoc=h}function innerPage(url){try{const od=root.contentDocument,inner=od&&od.getElementById('app');if(inner){inner.src=url;return true}}catch(e){}return false}function page(url){if(!innerPage(url)){root.removeAttribute('srcdoc');root.src=url}}function goExpiry(){page('/santa-expiry-loader.html?v=20261029-insumos-visible')}function goYield(){page('/santa-rendimientos-fixed.html?v=20261029-insumos-visible')}function goBread(){page('/santa-panes-fixed.html?v=20261029-insumos-visible')}function inject(){try{const od=root.contentDocument;if(!od)return;const inner=od.getElementById('app');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument,home=d.getElementById('home');if(!home||home.classList.contains('hide'))return;const badge=(d.querySelector('#head .badge')?.textContent||'').toUpperCase();const isAdmin=badge.includes('ADMINISTRACIÓN');if(isAdmin){const work=d.getElementById('work'),card=work?.querySelector('.card');if(card&&!d.getElementById('insumosAdminBtn')){const stockBtn=[...card.querySelectorAll('button')].find(b=>(b.textContent||'').trim()==='Control de stock');if(stockBtn){stockBtn.textContent='📦 Insumos';stockBtn.id='insumosAdminBtn'}}if(card&&!d.getElementById('yieldAdminBtn')){const b=d.createElement('button');b.id='yieldAdminBtn';b.className='sec';b.textContent='📊 Rendimientos';b.onclick=goYield;card.appendChild(b)}if(card&&!d.getElementById('breadAdminBtn')){const b=d.createElement('button');b.id='breadAdminBtn';b.className='sec';b.textContent='🍞 Panes';b.onclick=goBread;card.appendChild(b)}if(card&&!d.getElementById('expiryAdminBtn')){const b=d.createElement('button');b.id='expiryAdminBtn';b.className='sec';b.textContent='📅 Vencimientos';b.onclick=goExpiry;card.appendChild(b)}}else{const work=d.getElementById('work'),card=work?.querySelector('.card');if(card&&!d.getElementById('insumosEmployeeLabel')){const h=[...card.querySelectorAll('h3')].find(x=>(x.textContent||'').trim()==='Productos utilizados');if(h){h.textContent='📦 Insumos utilizados';h.id='insumosEmployeeLabel'}}if(card&&!d.getElementById('breadEmployeeTop')){const box=d.createElement('div');box.id='breadEmployeeTop';box.style.cssText='background:#fff7e7;border:1px solid #f0d49a;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#9a6810;margin-bottom:6px">🍞 Panes</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Registrá cada rodaja del pan que está en uso.</div><button type="button" style="margin:0">Abrir Panes</button>';box.querySelector('button').onclick=goBread;card.insertBefore(box,card.firstChild)}if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b>📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin:6px 0 9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button>Abrir vencimientos</button>';box.querySelector('button').onclick=goExpiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error(e)}}setInterval(inject,250);root.addEventListener('load',()=>setTimeout(inject,500));loadApp();</script></body></html>
