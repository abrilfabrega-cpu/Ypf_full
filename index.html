<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>YPF TRES SOLES FULL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3faff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}#app{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="/legacy-index.html?v=20261030-notas1"></iframe><script>
const root=document.getElementById('app'),API='https://eodbrfdzaizopiihuryz.supabase.co',KEY='sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo';function goExpiry(){root.src='/expiry.html?v=20261030-notas1'}function goYield(){try{const od=root.contentDocument,inner=od&&od.getElementById('app');if(inner){inner.src='/rendimientos.html?v=20261030-notas1';return}}catch(e){}root.src='/rendimientos.html?v=20261030-notas1'}
function auth(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.includes('auth-token'))continue;try{let x=JSON.parse(localStorage.getItem(k)||'null');for(let n=0;n<4&&x;n++){if(x.access_token&&x.user?.id)return {token:x.access_token,uid:x.user.id};x=x.currentSession||x.session||x.data||null}}catch{}}return null}async function noteReq(path,opt={}){const a=auth();if(!a)throw new Error('No se encontró la sesión');return fetch(API+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+a.token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation',...(opt.headers||{})}})}async function currentShift(){const a=auth();if(!a)return null;const r=await noteReq('shifts?employee_id=eq.'+a.uid+'&status=eq.open&select=id&limit=1');const j=await r.json();return j?.[0]?.id||null}async function loadNotes(d){try{const sid=await currentShift();if(!sid)return;const r=await noteReq('shift_notes?shift_id=eq.'+sid+'&select=note,no_notes');const j=await r.json(),x=j?.[0];const ta=d.getElementById('shiftNoteText'),ck=d.getElementById('shiftNoNotes');if(ta)ta.value=x?.note||'';if(ck)ck.checked=!!x?.no_notes}catch(e){console.error('Notas',e)}}async function saveNotes(d){try{const a=auth(),sid=await currentShift();if(!a||!sid)throw new Error('No hay un turno abierto');const ta=d.getElementById('shiftNoteText'),ck=d.getElementById('shiftNoNotes'),no=!!ck?.checked,note=(ta?.value||'').trim();if(!no&&!note)throw new Error('Escribí una nota o marcá “No hay notas”.');const r=await noteReq('shift_notes?on_conflict=shift_id',{method:'POST',body:JSON.stringify({shift_id:sid,user_id:a.uid,note:no?'':note,no_notes:no,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error((await r.text())||'No se pudo guardar');alert('Notas guardadas ✓')}catch(e){alert(e.message||e)}}
function inject(){try{const od=root.contentDocument;if(!od)return;const inner=od.getElementById('app');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument,home=d.getElementById('home');if(!home||home.classList.contains('hide'))return;const badge=(d.querySelector('#head .badge')?.textContent||'').trim().toUpperCase(),isAdmin=badge.includes('ADMINISTRACIÓN');if(isAdmin){const nav=d.querySelector('#head .nav');if(nav){nav.style.gridTemplateColumns='repeat(2,1fr)';const stockBtn=[...nav.querySelectorAll('button')].find(b=>(b.textContent||'').trim()==='Stock'||(b.textContent||'').includes('Insumos'));if(stockBtn){stockBtn.textContent='📦 Insumos';stockBtn.id='insumosAdminTop'}if(!d.getElementById('expiryAdminTop')){const b=d.createElement('button');b.id='expiryAdminTop';b.className='sec';b.textContent='📅 Vencimientos';b.onclick=goExpiry;nav.appendChild(b)}if(!d.getElementById('yieldAdminTop')){const b=d.createElement('button');b.id='yieldAdminTop';b.className='sec';b.textContent='📊 Rendimientos';b.onclick=goYield;nav.appendChild(b)}}}else{const work=d.getElementById('work'),card=work&&work.querySelector('.card');if(card){const h=[...card.querySelectorAll('h3')].find(x=>(x.textContent||'').trim()==='Productos utilizados');if(h)h.textContent='📦 Insumos utilizados';const isOpen=(card.querySelector('h2')?.textContent||'').includes('Turno abierto');if(isOpen&&!d.getElementById('shiftNotesBox')){const box=d.createElement('div');box.id='shiftNotesBox';box.style.cssText='margin-top:22px;padding-top:4px;border-top:1px solid #edf5f9';box.innerHTML='<h3>📝 Notas</h3><textarea id="shiftNoteText" placeholder="Escribí acá cualquier nota del turno"></textarea><label style="display:flex;gap:8px;align-items:center;margin:8px 0 12px"><input id="shiftNoNotes" type="checkbox" style="width:auto;margin:0"> No hay notas</label><button type="button" class="sec">Guardar notas</button>';box.querySelector('button').onclick=()=>saveNotes(d);const close=[...card.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Cerrar turno'));card.insertBefore(box,close||null);loadNotes(d)}}if(card&&!d.getElementById('expiryEmployeeTop')){const box=d.createElement('div');box.id='expiryEmployeeTop';box.style.cssText='background:#e7f6fd;border:1px solid #c9eafa;border-radius:16px;padding:14px;margin:0 0 16px';box.innerHTML='<b style="display:block;color:#1979a8;margin-bottom:6px">📅 Vencimientos</b><div style="font-size:13px;color:#6c8794;margin-bottom:9px">Cargá y revisá los vencimientos antes de completar el turno.</div><button type="button" style="margin:0">Abrir vencimientos</button>';box.querySelector('button').onclick=goExpiry;card.insertBefore(box,card.firstChild)}}}catch(e){console.error('UI',e)}}setInterval(inject,350);root.addEventListener('load',()=>setTimeout(inject,500));
</script></body></html>
