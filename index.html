========================= */

}

.select('*')
.eq('employee_id',u.id)
.eq('status','open')

async function openShift(kind){

/* =========================
STOCK EMPLEADAS
NO MUESTRA ELABORADOS
========================= */

function employeeStock(){

const preparedStockIds=new Set(
preparedProducts
.map(x=>x.stock_product_id)
.filter(Boolean)
);

const manualProducts=products.filter(p=>{

const linked=preparedStockIds.has(p.id);

const medialunas=
String(p.name||'')
.trim()
.toLowerCase()==='medialunas';

return !linked && !medialunas;
});

return manualProducts.map(p=>`

<div class="prod stockrow">

<div>

<b>${esc(p.name)}</b>

<div class="tiny">
Descuenta ${p.unit_step} ${esc(p.unit_label)}
</div>

</div>

<div>

<div class="qty" id="q${p.id}">
${fmt(p.stock_qty)}
</div>

<button onclick="take('${p.id}')">
− Descontar
</button>

</div>

</div>

`).join('');
}


async function take(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const qty=Number(p.unit_step||1);

if(!confirm(
`¿Descontar ${fmt(qty)} ${p.unit_label||'unidad'} de ${p.name}?`
)){
return;
}

const r=await sb.rpc(
'decrement_stock',
{
p_product:id,
p_shift:shift?.id||null
}
);

if(r.error){
alert(r.error.message);
return;
}

await loadProducts();

renderShift();
}


/* =========================
ELABORADOS EMPLEADAS
========================= */

function preparedHTML(){

if(!preparedProducts.length){

return `
<p class="muted">
No hay productos elaborados configurados.
</p>
`;
}

return preparedProducts.map(p=>`

<div class="prepared">

<b>${esc(p.name)}</b>

<p class="tiny">
Completá las cantidades del turno.
La aplicación calcula automáticamente lo vendido.
</p>

<label>
Cantidad que recibís al comenzar
</label>

<input
id="prep_open_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que cocinás durante el turno
</label>

<input
id="prep_made_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<label>
Cantidad que queda al finalizar
</label>

<input
id="prep_close_${p.id}"
type="number"
min="0"
step="1"
oninput="updatePreparedCalculation('${p.id}')"
>

<div
class="calc"
id="prep_calc_${p.id}">
Vendidas: —
</div>

<button
class="sec"
onclick="savePreparedProduct('${p.id}')">
Guardar ${esc(p.name)}
</button>

</div>

`).join('');
}


function updatePreparedCalculation(id){

const a=$('prep_open_'+id)?.value;
const b=$('prep_made_'+id)?.value;
const c=$('prep_close_'+id)?.value;

const box=$('prep_calc_'+id);

if(!box)return;

if(a===''||b===''||c===''){

box.textContent='Vendidas: —';

return;
}

const opening=Number(a);
const made=Number(b);
const closing=Number(c);

const sold=opening+made-closing;

if(sold<0){

box.textContent='Revisá las cantidades';

return;
}

box.textContent='Vendidas: '+fmt(sold);
}


async function loadPreparedCounts(){

if(!shift)return;

const r=await sb
.from('prepared_shift_counts')
.select('*')
.eq('shift_id',shift.id);

if(r.error){
console.error(r.error);
return;
}

(r.data||[]).forEach(x=>{

const a=$('prep_open_'+x.prepared_product_id);
const b=$('prep_made_'+x.prepared_product_id);
const c=$('prep_close_'+x.prepared_product_id);

if(a)a.value=x.opening_qty??'';
if(b)b.value=x.made_qty??'';
if(c)c.value=x.closing_qty??'';

updatePreparedCalculation(
x.prepared_product_id
);

});
}


async function savePreparedProduct(
id,
required=false
){

const ao=$('prep_open_'+id);
const bm=$('prep_made_'+id);
const cc=$('prep_close_'+id);

if(!ao||!bm||!cc)return true;

const av=ao.value;
const bv=bm.value;
const cv=cc.value;

if(av===''||bv===''){

if(required){

alert(
'Completá la cantidad inicial y lo cocinado durante el turno.'
);

return false;
}

return true;
}

const opening=Number(av);
const made=Number(bv);

const closing=
cv===''?null:Number(cv);

if(
!Number.isInteger(opening)||
opening<0||
!Number.isInteger(made)||
made<0
){

alert(
'Las cantidades deben ser números enteros.'
);

return false;
}

if(required && closing===null){

alert(
'Completá cuánto queda de cada elaborado antes de cerrar el turno.'
);

return false;
}

if(
closing!==null &&
(
!Number.isInteger(closing)||
closing<0
)
){

alert(
'La cantidad final no es válida.'
);

return false;
}

if(
closing!==null &&
closing>opening+made
){

alert(
'La cantidad final no puede ser mayor que lo recibido más lo cocinado.'
);

return false;
}

const r=await sb
.from('prepared_shift_counts')
.upsert(
{
shift_id:shift.id,
prepared_product_id:id,
user_id:me.id,
opening_qty:opening,
made_qty:made,
closing_qty:closing,
updated_at:new Date().toISOString()
},
{
onConflict:'shift_id,prepared_product_id'
}
);

if(r.error){

alert(r.error.message);

return false;
}

updatePreparedCalculation(id);

if($('status')){
$('status').textContent=
'Elaborados guardados ✓';
}

return true;
}


async function saveAllPrepared(
required=false
){

for(const p of preparedProducts){

const ok=
await savePreparedProduct(
p.id,
required
);

if(!ok)return false;
}

return true;
}

LECHES
========================= */

shift_id:shift.id,

$('milk_whole').value||0
),
skim_boxes:Number(

),

});

alert(r.error.message);

return false;
}

$('status').textContent=
'Leches guardadas ✓';

return true;
}


async function loadMilk(){

const r=await sb
.from('milk_usage')
.select('*')
.eq('shift_id',shift.id)
.maybeSingle();

if(r.data){

$('milk_whole').value=
r.data.whole_boxes;

$('milk_skim').value=
r.data.skim_boxes;
}
}


/* =========================
CAJA
========================= */

NO FACTURADOS

.insert({

}

.from('unbilled_items')

/* =========================
NOTAS
========================= */

function toggleNotes(){

const n=$('nonotes').checked;

$('note').disabled=n;

if(n){
$('note').value='';
}
}


async function saveNotes(){

const r=await sb
.from('shift_notes')
.upsert({
shift_id:shift.id,
user_id:me.id,
note:$('note').value.trim()||null,
no_notes:$('nonotes').checked,
updated_at:new Date().toISOString()
});

if(r.error){

alert(r.error.message);

return false;
}

return true;
}


async function loadNotes(){

const r=await sb
.from('shift_notes')
.select('*')
.eq('shift_id',shift.id)
.maybeSingle();

if(r.data){

$('note').value=
r.data.note||'';

$('nonotes').checked=
!!r.data.no_notes;

toggleNotes();
}
}


/* =========================
CERRAR TURNO
========================= */

async function closeShift(){

if(
$('milk_whole').value===''||
$('milk_skim').value===''
){

alert(
'Completá las leches utilizadas. Si no usaron, poné 0.'
);

return;
}

const milkOK=await saveMilk();

if(milkOK===false)return;

const cashOK=await saveCash();

if(cashOK===false)return;

const preparedOK=
await saveAllPrepared(true);

if(!preparedOK)return;

const notesOK=
await saveNotes();

if(notesOK===false)return;

if(!confirm(
'¿Confirmás cerrar el turno? Los elaborados vendidos se calcularán automáticamente.'
)){
return;
}


/* CALCULA Y DESCUENTA ELABORADOS */

const calc=await sb.rpc(
'finalize_prepared_sales',
{
p_shift:shift.id
}
);

if(calc.error){

alert(
'No se pudo calcular el stock de elaborados: '
+calc.error.message
);

return;
}


/* CIERRA TURNO */

const r=await sb
.from('shifts')
.update({
status:'closed',
closed_at:new Date().toISOString()
})
.eq('id',shift.id);

if(r.error){

alert(r.error.message);

return;
}

shift=null;

await loadProducts();

alert(
'Turno cerrado correctamente ✓'
);

renderHead();
employeeHome();
}

async function turnDetail(id){

const [
sr,
mr,
pr,
ur,
nr,
mvr
]=await Promise.all([

sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('id',id)
.single(),

sb
.from('milk_usage')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('prepared_shift_counts')
.select('*,prepared_products(name)')
.eq('shift_id',id)
.order('updated_at'),

sb
.from('unbilled_items')
.select('*')
.eq('shift_id',id)
.order('created_at'),

sb
.from('shift_notes')
.select('*')
.eq('shift_id',id)
.maybeSingle(),

sb
.from('stock_movements')
.select('*,products(name,unit_label)')
.eq('shift_id',id)
.order('created_at')

]);

const s=sr.data;

if(!s)return;

const prepared=
pr.data||[];

const preparedText=
prepared.length
?prepared.map(x=>{

const sold=
x.sold_qty!=null
?Number(x.sold_qty)
:
x.closing_qty!=null
?Number(x.opening_qty)
+Number(x.made_qty)
-Number(x.closing_qty)
:null;

return `

<div class="preparedAdmin">

<b>
${esc(
x.prepared_products?.name||
'Elaborado'
)}
</b>

<div class="tiny">

Inicial:
${fmt(x.opening_qty)}

· Cocinadas:
${fmt(x.made_qty)}

· Final:
${x.closing_qty==null
?'—'
:fmt(x.closing_qty)}

</div>

<div style="margin-top:8px">

Vendidas:
<b>
${sold==null
?'—'
:fmt(sold)}
</b>

</div>

</div>
`;

}).join('')

:
'<p class="muted">Sin datos de elaborados.</p>';


const moves=
(mvr.data||[])
.filter(x=>
Number(x.delta)<0
);

const totals={};

moves.forEach(x=>{

const n=
x.products?.name||
'Producto';

totals[n]=
(totals[n]||0)
+
Math.abs(
Number(x.delta)
);
});


$('work').innerHTML=`

<div class="card">

<button
class="sec"
onclick="adminTurns()">
← Volver
</button>

<h2>
${esc(
s.profiles?.full_name||
'Turno'
)}
</h2>

<div class="badge">

${s.kind==='morning'
?'MAÑANA'
:'TARDE'}

·

${s.status==='closed'
?'CERRADO'
:'ABIERTO'}

</div>


<h3>Elaborados</h3>

${preparedText}


<h3>Stock consumido</h3>

${Object.entries(totals)
.map(([n,v])=>`

<div class="item">

${esc(n)}:
<b>${fmt(v)}</b>

</div>

`).join('')
||
'<p class="muted">Sin descuentos.</p>'}


<h3>Leches</h3>

<p>

Entera:
<b>
${fmt(
mr.data?.whole_boxes
)}
</b>

·

Descremada:
<b>
${fmt(
mr.data?.skim_boxes
)}
</b>

</p>


<h3>Sobrante de caja</h3>

<div class="money">
$ ${fmt(s.cash_surplus)}
</div>


<h3>No facturados</h3>

${(ur.data||[])
.map(x=>`

<div class="item">

${esc(x.product_name)}

· código
${esc(x.product_code)}

·
${(x.sold_at||'').slice(0,5)}

</div>

`).join('')
||
'<p class="muted">Ninguno.</p>'}


<h3>Notas</h3>

<p>

${nr.data?.no_notes
?'No hay notas'
:esc(
nr.data?.note||
'Sin cargar'
)}

</p>

</div>
`;
}

async function adminAlerts(
inDash=false
){

const r=await sb
.from('shifts')
.select('*,profiles(full_name)')
.eq('status','closed')
.order(
'closed_at',
{ascending:false}
)
.limit(15);

let alerts=[];

for(const s of (r.data||[])){

if(Number(s.cash_surplus)>0){

alerts.push(`

<div class="alert">

<b>
Diferencia de caja ·
${esc(
s.profiles?.full_name||
''
)}
</b>

<br>

Sobrante:
$ ${fmt(s.cash_surplus)}

</div>

`);
}
}


/* ALERTAS DE ELABORADOS */

const cr=await sb
.from('prepared_shift_counts')
.select(
'*,prepared_products(name),shifts(opened_at,status,employee_id,profiles(full_name))'
)
.order(
'updated_at',
{ascending:false}
)
.limit(100);

const grouped={};

(cr.data||[])
.filter(
x=>x.shifts?.status==='closed'
)
.forEach(x=>{

const key=
x.prepared_product_id;

if(!grouped[key]){
grouped[key]=[];
}

grouped[key].push(x);

});


Object.values(grouped)
.forEach(arr=>{

arr.sort(
(a,b)=>
new Date(
a.shifts.opened_at
)
-
new Date(
b.shifts.opened_at
)
);

for(
let i=1;
i<arr.length;
i++
){

const prev=arr[i-1];
const cur=arr[i];

if(
prev.closing_qty!=null &&
cur.opening_qty!=null &&
Number(prev.closing_qty)!==
Number(cur.opening_qty)
){

const d=
Number(prev.closing_qty)
-
Number(cur.opening_qty);

alerts.push(`

<div class="alert">

<b>
Diferencia de
${esc(
cur.prepared_products?.name||
'elaborado'
)}
</b>

<br>

${esc(
prev.shifts.profiles?.full_name||
'Turno anterior'
)}

dejó

${fmt(
prev.closing_qty
)};

${esc(
cur.shifts.profiles?.full_name||
'turno siguiente'
)}

recibió

${fmt(
cur.opening_qty
)}.

<b>

${d>0
?'Faltan '+fmt(d)
:'Sobran '+fmt(Math.abs(d))}

</b>

</div>

`);
}
}
});


const html=
alerts.join('')
||
'<div class="okbox">No hay alertas pendientes en los últimos cierres.</div>';


if(inDash){

const d=$('dash');

if(d){

d.innerHTML=`

<div class="card">

<h2>
Alertas recientes
</h2>

${html}

</div>
`;
}

}else{

$('work').innerHTML=`

<div class="card">

<h2>Alertas</h2>

${html}

</div>
`;
}
}
