<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YPF TRES SOLES FULL</title><style>html,body,#app{width:100%;height:100%;margin:0;border:0;display:block}</style></head><body><iframe id="app" src="app.html"></iframe><script>
const frame=document.getElementById('app');frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;
const css=d.createElement('style');css.textContent=`.manualNoticeOverlay{display:none;position:fixed;inset:0;background:#16384b66;z-index:99999;align-items:center;justify-content:center;padding:20px}.manualNoticeBox{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 60px #16384b45;position:relative}.manualNoticeX{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:38px;height:38px;padding:0;margin:0;background:#e7f6fd;color:#1979a8;font-size:22px}.manualNoticeBody{white-space:pre-wrap;line-height:1.45;margin-top:10px}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.summaryStat{background:#f7fcff;border:1px solid #d7effa;border-radius:14px;padding:12px}.summaryStat b{font-size:20px;display:block}.summaryList{padding:8px 0;border-bottom:1px solid #edf5f9}.rating{padding:12px;border-radius:14px;font-weight:800;margin:10px 0}.rating.good{background:#edf9f3;color:#16875d}.rating.warn{background:#fff7e7;color:#9a6810}.rating.bad{background:#fdeeee;color:#a73535}@media print{.top,#head,button,.noPrint{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.wrap{max-width:none;padding:0}}`;d.head.appendChild(css);
const modal=d.createElement('div');modal.id='manualEmployeeNotice';modal.className='manualNoticeOverlay';modal.innerHTML='<div class="manualNoticeBox"><button class="manualNoticeX" id="manualNoticeClose">×</button><span class="badge">AVISO</span><h2 id="manualEmployeeNoticeTitle"></h2><div id="manualEmployeeNoticeBody" class="manualNoticeBody"></div></div>';d.body.appendChild(modal);d.getElementById('manualNoticeClose').onclick=()=>modal.style.display='none';
const s=d.createElement('script');s.textContent=`
(function(){
async function getGlobalNotice(){const r=await sb.from('admin_alerts').select('id,title,body,created_at').is('shift_id',null).eq('kind','global').order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error){console.error(r.error);return null}return r.data||null}
async function showManualEmployeeNotice(){if(!me||me.role==='manager')return;const n=await getGlobalNotice();if(!n)return;document.getElementById('manualEmployeeNoticeTitle').textContent=n.title||'Aviso';document.getElementById('manualEmployeeNoticeBody').textContent=n.body||'';document.getElementById('manualEmployeeNotice').style.display='flex'}
async function adminManualNotice(){const n=await getGlobalNotice();document.getElementById('work').innerHTML=\`<div class="card"><h2>Aviso a empleadas</h2><p class="muted">Mientras esté activo, aparecerá cada vez que una empleada ingrese a la app.</p>\${n?\`<div class="alert"><b>Aviso activo</b><br>\${esc(n.title)}<div style="white-space:pre-wrap;margin-top:6px">\${esc(n.body)}</div></div>\`:'<div class="okbox">No hay ningún aviso activo.</div>'}<label>Título</label><input id="manualNoticeTitle" value="\${esc(n?.title||'Aviso importante')}"><label>Mensaje</label><textarea id="manualNoticeBody" placeholder="Escribí el aviso..."></textarea><button onclick="placeManualNotice()">Colocar aviso</button>\${n?'<button class="red" onclick="removeManualNotice()">Sacar aviso</button>':''}<button class="sec" onclick="adminHome()">Volver</button></div>\`;if(n)document.getElementById('manualNoticeBody').value=n.body||''}
window.adminManualNotice=adminManualNotice;window.placeManualNotice=async function(){const title=document.getElementById('manualNoticeTitle').value.trim()||'Aviso importante';const body=document.getElementById('manualNoticeBody').value.trim();if(!body){alert('Escribí el aviso.');return}let r=await sb.from('admin_alerts').delete().is('shift_id',null).eq('kind','global');if(r.error){alert(r.error.message);return}r=await sb.from('admin_alerts').insert({shift_id:null,kind:'global',title,body});if(r.error){alert(r.error.message);return}alert('Aviso colocado ✓');adminManualNotice()};window.removeManualNotice=async function(){const r=await sb.from('admin_alerts').delete().is('shift_id',null).eq('kind','global');if(r.error){alert(r.error.message);return}alert('Aviso retirado ✓');adminManualNotice()};function addAdminButtons(){if(!me||me.role!=='manager')return;const work=document.getElementById('work');if(!work)return;const card=work.querySelector('.card');if(!card)return;if(!document.getElementById('manualNoticeBtn')){const b=document.createElement('button');b.id='manualNoticeBtn';b.className='sec';b.textContent='Aviso a empleadas';b.onclick=adminManualNotice;card.appendChild(b)}if(!document.getElementById('summaryBtn')){const b=document.createElement('button');b.id='summaryBtn';b.className='sec';b.textContent='📊 Resúmenes';b.onclick=adminSummaries;card.appendChild(b)}}
function mondayOf(date){const x=new Date(date);x.setHours(12,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}
function addDays(iso,n){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function prettyDate(iso){return new Date(iso+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function ratingClass(x){return String(x).includes('Excelente')||String(x).includes('Buen')?'good':String(x).includes('Fuera')?'bad':'warn'}
function listRows(arr){return (arr||[]).length?(arr||[]).map(x=>\`<div class="summaryList"><b>\${esc(x.product)}</b><span style="float:right">\${fmt(x.quantity)}</span></div>\`).join(''):'<p class="muted">Sin movimientos.</p>'}
async function loadWeek(week){const r=await sb.rpc('business_week_summary',{p_week_start:week});if(r.error)throw r.error;return r.data}
window.adminSummaries=async function(){const week=mondayOf(new Date());document.getElementById('work').innerHTML=\`<div class="card"><span class="badge">ADMINISTRACIÓN</span><h2>📊 Resúmenes</h2><p class="muted">Octubre: modo prueba · Desde noviembre: informes oficiales.</p><button onclick="showWeeklySummary('\${week}')">Resumen semanal</button><button class="sec" onclick="showMonthlySummary()">Resumen mensual</button><button class="ghost" onclick="adminHome()">Volver</button></div>\`}
window.showWeeklySummary=async function(week){try{const x=await loadWeek(week);document.getElementById('work').innerHTML=\`<div class="card"><span class="badge">RESUMEN SEMANAL</span><h2>\${prettyDate(x.week_start)} al \${prettyDate(x.week_end)}</h2><div class="summaryGrid"><div class="summaryStat"><span class="tiny">Leches utilizadas</span><b>\${fmt(x.milk_used)}</b></div><div class="summaryStat"><span class="tiny">Cafés informados</span><b>\${fmt(x.coffee_sold)}</b></div><div class="summaryStat"><span class="tiny">No facturados</span><b>\${fmt(x.unbilled_quantity)}</b><span class="tiny">$ \${fmt(x.unbilled_value)}</span></div><div class="summaryStat"><span class="tiny">Sobrante de caja</span><b>$ \${fmt(x.cash_surplus)}</b></div></div><div class="rating \${ratingClass(x.coffee_rating)}">☕ \${esc(x.coffee_rating)}\${x.coffee_per_milk?' · '+fmt(x.coffee_per_milk)+' cafés por leche':''}</div><label>Cafés estimados vendidos esta semana</label><input id="weeklyCoffee" type="number" min="0" step="1" value="\${Number(x.coffee_sold||0)}"><button class="noPrint" onclick="saveWeeklyCoffee('\${week}')">Guardar cafés y recalcular</button><h3>Productos utilizados / vendidos</h3>\${listRows(x.products_used)}<h3>Compras de la semana</h3>\${listRows(x.purchases)}<button class="green noPrint" onclick="window.print()">Imprimir / Guardar PDF</button><div class="row noPrint"><button class="sec" onclick="showWeeklySummary('\${addDays(week,-7)}')">← Semana anterior</button><button class="sec" onclick="showWeeklySummary('\${addDays(week,7)}')">Semana siguiente →</button></div><button class="ghost noPrint" onclick="adminSummaries()">Volver</button></div>\`}catch(e){console.error(e);alert('No se pudo cargar el resumen. '+(e.message||''))}}
window.saveWeeklyCoffee=async function(week){const n=Number(document.getElementById('weeklyCoffee').value);if(!Number.isInteger(n)||n<0){alert('Ingresá una cantidad válida de cafés.');return}const r=await sb.rpc('save_weekly_coffee',{p_week_start:week,p_coffee:n});if(r.error){alert(r.error.message);return}showWeeklySummary(week)}
window.showMonthlySummary=async function(){const now=new Date();const month=prompt('Mes a consultar (AAAA-MM)',now.toISOString().slice(0,7));if(!month)return;if(!/^\\d{4}-\\d{2}$/.test(month)){alert('Usá formato AAAA-MM');return}const first=month+'-01',next=new Date(first+'T12:00:00');next.setMonth(next.getMonth()+1);const last=new Date(next);last.setDate(last.getDate()-1);let w=mondayOf(first),weeks=[];while(new Date(w+'T12:00:00')<=last){weeks.push(w);w=addDays(w,7)}try{const data=await Promise.all(weeks.map(loadWeek));let milk=0,coffee=0,unb=0,cash=0;data.forEach(x=>{milk+=Number(x.milk_used||0);coffee+=Number(x.coffee_sold||0);unb+=Number(x.unbilled_value||0);cash+=Number(x.cash_surplus||0)});document.getElementById('work').innerHTML=\`<div class="card"><span class="badge">RESUMEN MENSUAL</span><h2>\${new Date(first+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</h2><div class="summaryGrid"><div class="summaryStat"><span class="tiny">Leches utilizadas</span><b>\${fmt(milk)}</b></div><div class="summaryStat"><span class="tiny">Cafés informados</span><b>\${fmt(coffee)}</b></div><div class="summaryStat"><span class="tiny">No facturado</span><b>$ \${fmt(unb)}</b></div><div class="summaryStat"><span class="tiny">Sobrante de caja</span><b>$ \${fmt(cash)}</b></div></div>\${data.map((x,i)=>\`<div class="prepared"><b>Semana \${i+1} · \${prettyDate(x.week_start)} al \${prettyDate(x.week_end)}</b><div class="tiny" style="margin-top:7px">Leches: \${fmt(x.milk_used)} · Cafés: \${fmt(x.coffee_sold)} · \${esc(x.coffee_rating)}</div><h3>Usado / vendido</h3>\${listRows(x.products_used)}<h3>Compras</h3>\${listRows(x.purchases)}<div class="tiny">No facturado: \${fmt(x.unbilled_quantity)} productos · $ \${fmt(x.unbilled_value)} · Sobrante: $ \${fmt(x.cash_surplus)}</div></div>\`).join('')}<button class="green noPrint" onclick="window.print()">Imprimir / Guardar PDF mensual</button><button class="ghost noPrint" onclick="adminSummaries()">Volver</button></div>\`}catch(e){console.error(e);alert('No se pudo generar el resumen mensual. '+(e.message||''))}}
const originalAddStock=window.addStock;window.addStock=async function(id){const input=document.getElementById('add'+id);const qty=Number(input?.value||0);const before=products.find(p=>p.id===id)?.stock_qty;await originalAddStock(id);await loadProducts();const after=products.find(p=>p.id===id)?.stock_qty;if(qty>0&&Number(after)>Number(before)&&confirm('¿Deseás agregar esta carga a las compras de la semana?')){const r=await sb.from('stock_purchases').insert({product_id:id,quantity:qty,user_id:me.id,note:'Registrado desde carga de stock'});if(r.error)alert('El stock se cargó, pero no pude registrar la compra: '+r.error.message);else alert('Compra agregada al resumen semanal ✓')}};
window.openShift=async function(kind){if(shift){renderShift();return}try{await sb.rpc('close_expired_shifts')}catch(e){console.error(e)}const existing=await sb.from('shifts').select('id,kind,employee_id').eq('kind',kind).eq('status','open').limit(1).maybeSingle();if(existing.error){alert('No pudimos comprobar el turno. Intentá nuevamente.');return}if(existing.data){alert('El turno '+(kind==='morning'?'Mañana':'Tarde')+' ya fue abierto por otra empleada. No es posible abrirlo nuevamente.');return}const r=await sb.from('shifts').insert({employee_id:me.id,kind}).select().single();if(r.error){if(r.error.code==='23505'||String(r.error.message||'').includes('one_open_shift_per_kind')){alert('El turno '+(kind==='morning'?'Mañana':'Tarde')+' acaba de ser abierto por otra empleada.');return}alert('No se pudo abrir el turno. Intentá nuevamente.');return}shift=r.data;shiftUsage={};renderHead();renderShift()};
const closeDraftKey=()=>shift?.id?'ypf_close_'+shift.id:null;function readCloseDraft(){const k=closeDraftKey();if(!k)return null;try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}function writeCloseDraft(){const k=closeDraftKey();if(!k)return;const w=document.getElementById('wholeMilk'),sk=document.getElementById('skimMilk'),c=document.getElementById('cashSurplus');if(!w||!sk||!c)return;localStorage.setItem(k,JSON.stringify({whole:w.value,skim:sk.value,cash:c.value,updated:Date.now()}))}function restoreCloseDraft(){const x=readCloseDraft();if(!x)return;const w=document.getElementById('wholeMilk'),sk=document.getElementById('skimMilk'),c=document.getElementById('cashSurplus');if(w)w.value=x.whole??0;if(sk)sk.value=x.skim??0;if(c)c.value=x.cash??0}function bindCloseDraft(){['wholeMilk','skimMilk','cashSurplus'].forEach(id=>{const el=document.getElementById(id);if(el&&!el.dataset.safeClose){el.dataset.safeClose='1';el.addEventListener('input',writeCloseDraft);el.addEventListener('change',writeCloseDraft)}})}
const originalLoadClosingFields=loadClosingFields;window.loadClosingFields=async function(){const hadDraft=!!readCloseDraft();await originalLoadClosingFields();if(hadDraft)restoreCloseDraft();bindCloseDraft()};const originalRenderShift=renderShift;window.renderShift=function(){originalRenderShift();setTimeout(()=>{restoreCloseDraft();bindCloseDraft()},0)};const originalShowCloseSummary=showCloseSummary;window.showCloseSummary=async function(){writeCloseDraft();return originalShowCloseSummary()};window.closeShift=async function(whole,skim,cash){if(closingShift||!shift)return;const shiftId=shift.id;const draft=readCloseDraft();if(draft){whole=Number(draft.whole||0);skim=Number(draft.skim||0);cash=Number(draft.cash||0)}if(!Number.isFinite(whole)||!Number.isFinite(skim)||!Number.isFinite(cash)||whole<0||skim<0||cash<0){alert('Revisá los datos del cierre.');return}closingShift=true;const btn=document.getElementById('confirmCloseBtn');if(btn){btn.disabled=true;btn.textContent='Guardando y verificando...'}try{const r=await sb.rpc('close_shift_atomic',{p_shift:shiftId,p_whole:whole,p_skim:skim,p_cash:cash});if(r.error)throw r.error;const v=await sb.rpc('verify_shift_close',{p_shift:shiftId});if(v.error)throw v.error;const saved=v.data||{};if(saved.status!=='closed'||Number(saved.whole_milk)!==Number(whole)||Number(saved.skim_milk)!==Number(skim)||Number(saved.cash_surplus)!==Number(cash)||saved.prepared_complete!==true)throw new Error('La verificación final no coincide con los datos cargados.');localStorage.removeItem('ypf_close_'+shiftId);shift=null;shiftUsage={};await loadProducts();renderHead();employeeHome();alert('Turno cerrado con éxito ✓ Todos los datos fueron guardados y verificados.')}catch(e){console.error(e);alert('NO se confirmó el cierre. Tus datos siguen guardados para reintentar. '+(e.message||''));if(btn){btn.disabled=false;btn.textContent='Confirmar y cerrar turno'}}finally{closingShift=false}};
const wait=setInterval(()=>{if(!me)return;clearInterval(wait);if(me.role==='manager'){addAdminButtons();const originalAdminHome=adminHome;window.adminHome=function(){originalAdminHome();setTimeout(addAdminButtons,0)}}else{showManualEmployeeNotice();setTimeout(()=>{restoreCloseDraft();bindCloseDraft()},0)}},250);
})();`;d.body.appendChild(s)});
</script></body></html>
