<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panes · YPF SANTA TERESITA FULL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:#fff;padding:25px 18px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.bread{background:#f7fcff;border:1px solid #d7effa;padding:16px;border-radius:18px;margin:12px 0}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}.open{background:#fff7e7;color:#9a6810}.closed{background:#edf9f3;color:#16875d}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.red{background:#c84c45}.green{background:#16875d}.muted{font-size:13px;color:#6c8794}.tiny{font-size:12px;color:#6c8794}.count{font-size:36px;font-weight:800;margin:8px 0}.item{padding:11px 0;border-bottom:1px solid #edf5f9}.hide{display:none}.avg{background:#edf9f3;border:1px solid #cbe9d8;padding:12px;border-radius:14px;font-weight:800;margin:10px 0}</style></head><body><div class="top"><div class="wrap"><span id="roleBadge" class="badge">PANES</span><h2 style="margin:8px 0 0">🍞 Panes</h2><div style="opacity:.9;font-size:13px">Rendimiento por pan entero</div></div></div><div class="wrap"><div id="gate" class="card">Comprobando acceso…</div><div id="app" class="hide"><div id="work"></div></div></div><script>const URL='https://sblkngrblimfhhkqilop.supabase.co',KEY='sb_publishable_CipXByoTnXEwjcYMXN3Btg_zyI104nD';const sb=supabase.createClient(URL,KEY);let me=null,shift=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=x=>x?new Date(x).toLocaleString('es-AR'):'—';async function init(){const u=(await sb.auth.getUser()).data?.user;if(!u){gate.textContent='No pude recuperar tu sesión. Volvé a la app y abrí Panes nuevamente.';return}const p=await sb.from('profiles').select('id,full_name,role,active').eq('id',u.id).single();if(p.error||!p.data?.active){gate.textContent='No pude comprobar tu perfil.';return}me=p.data;if(me.role!=='manager'){const s=await sb.from('shifts').select('id,kind,status').eq('employee_id',me.id).eq('status','open').maybeSingle();shift=s.data||null}gate.classList.add('hide');app.classList.remove('hide');roleBadge.textContent=me.role==='manager'?'ADMINISTRACIÓN':'EMPLEADA';me.role==='manager'?admin():employee()}async function getTypes(){const r=await sb.from('bread_types').select('id,name,sort_order,product_id,products(name,stock_qty)').eq('active',true).order('sort_order');if(r.error)throw r.error;return r.data||[]}async function getOpen(){const r=await sb.from('bread_units').select('*').eq('status','open');if(r.error)throw r.error;return r.data||[]}async function employee(){try{const [types,open]=await Promise.all([getTypes(),getOpen()]);work.innerHTML=`<div class="card"><h2>Panes en uso</h2><p class="muted">El contador continúa aunque cambie el turno. El stock del pan entero se descuenta recién cuando finalizás el pan.</p>${types.map(t=>{const x=open.find(o=>o.bread_type_id===t.id),stock=t.products?.stock_qty??0;return `<div class="bread"><b>${esc(t.name)}</b><div class="tiny">Stock de panes enteros: ${stock}</div>${x?`<span class="badge open">EN USO · Pan #${x.unit_number}</span><div class="count">${x.slices_used}</div><div class="muted">rodajas utilizadas</div><button onclick="slice('${x.id}')">🍞 Usé 1 rodaja</button><button class="red" onclick="finish('${x.id}','${esc(t.name)}')">Finalizar pan / Descontar 1 pan entero</button><div class="tiny">Abierto ${dt(x.opened_at)}</div>`:`<div class="muted" style="margin:10px 0">No hay un pan abierto.</div><button onclick="start('${t.id}','${esc(t.name)}')">Empezar pan nuevo</button>`}</div>`}).join('')}<button class="sec" onclick="location.href='/'">Volver</button></div>`}catch(e){work.innerHTML='<div class="card">'+esc(e.message||e)+'</div>'}}async function start(typeId,name){if(!shift?.id){alert('Para empezar un pan necesitás tener un turno abierto.');return}if(!confirm('¿Empezar un '+name+' nuevo?'))return;const r=await sb.rpc('start_bread_unit',{p_bread_type:typeId,p_shift:shift.id});if(r.error){alert(r.error.message);return}employee()}async function slice(id){if(!shift?.id){alert('Necesitás tener un turno abierto para registrar rodajas.');return}const r=await sb.rpc('use_bread_slice',{p_bread_unit:id,p_shift:shift.id});if(r.error){alert(r.error.message);return}employee()}async function finish(id,name){if(!shift?.id){alert('Necesitás tener un turno abierto para finalizar el pan.');return}if(!confirm('¿Finalizar '+name+' y descontar 1 pan entero del stock?'))return;const r=await sb.rpc('finish_bread_unit',{p_bread_unit:id,p_shift:shift.id});if(r.error){alert(r.error.message);return}const x=r.data||{};alert('Pan finalizado ✓\nRendimiento: '+(x.slices_used??'—')+' rodajas\nSe descontó 1 pan del stock.');employee()}async function admin(){try{const types=await getTypes();const r=await sb.from('bread_units').select('*,bread_types(name),opened_by_profile:profiles!bread_units_opened_by_fkey(full_name),finished_by_profile:profiles!bread_units_finished_by_fkey(full_name)').order('opened_at',{ascending:false});if(r.error)throw r.error;const units=r.data||[];work.innerHTML=`<div class="card"><h2>Historial de panes</h2><p class="muted">Rendimiento por unidad. Las rodajas no modifican stock; finalizar sí descuenta 1 pan entero.</p>${types.map(t=>{const all=units.filter(x=>x.bread_type_id===t.id),done=all.filter(x=>x.status==='closed'),avg=done.length?(done.reduce((a,x)=>a+Number(x.slices_used||0),0)/done.length):0;return `<div class="bread"><h3 style="margin:0 0 8px">${esc(t.name)}</h3><div class="avg">Promedio: ${done.length?avg.toFixed(1):'—'} rodajas por pan</div>${all.length?all.map(x=>`<div class="item"><b>Pan #${x.unit_number}</b> <span class="badge ${x.status==='closed'?'closed':'open'}">${x.status==='closed'?'FINALIZADO':'EN USO'}</span><div>${x.slices_used} rodajas${x.status==='closed'?' · rendimiento final':''}</div><div class="tiny">Abrió: ${esc(x.opened_by_profile?.full_name||'—')} · ${dt(x.opened_at)}${x.opened_shift_id?' · turno registrado':''}</div>${x.status==='closed'?`<div class="tiny">Finalizó: ${esc(x.finished_by_profile?.full_name||'—')} · ${dt(x.finished_at)}${x.finished_shift_id?' · turno registrado':''}</div>`:''}</div>`).join(''):'<p class="muted">Todavía no hay panes registrados.</p>'}</div>`}).join('')}<button class="sec" onclick="location.href='/'">Volver</button></div>`}catch(e){work.innerHTML='<div class="card">'+esc(e.message||e)+'</div>'}}init();</script></body></html>
