<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Rendimientos · Santa Teresita</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:#fff;padding:25px 18px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.green{background:#16875d}input,textarea{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:14px 0;border-bottom:1px solid #edf5f9}.muted{font-size:13px;color:#6c8794}.open,.closed{padding:4px 9px;border-radius:20px;font-size:12px}.open{background:#fff7e7;color:#9a6810}.closed{background:#edf9f3;color:#16875d}.hide{display:none}</style></head><body><div class="top"><div class="wrap"><span class="badge">ADMINISTRACIÓN Y EMPLEADAS</span><h2>📊 Rendimientos</h2></div></div><div class="wrap"><div id="gate" class="card">Abriendo Rendimientos…</div><div id="app" class="hide"><div class="card"><button onclick="showNew()">+ Abrir nuevo insumo</button><button class="sec" onclick="location.href='/'">Volver</button></div><div id="work"></div></div></div><script>
const SUPABASE_URL='https://sblkngrblimfhhkqilop.supabase.co',KEY='sb_publishable_CipXByoTnXEwjcYMXN3Btg_zyI104nD';let sb,me;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),days=(a,b)=>Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1;
function findStoredSession(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.includes('auth-token'))continue;try{let x=JSON.parse(localStorage.getItem(k)||'null');for(let n=0;n<4&&x;n++){if(x.access_token&&x.refresh_token)return x;x=x.currentSession||x.session||x.data||null}}catch{}}return null}
async function init(){try{sb=supabase.createClient(SUPABASE_URL,KEY);let sess=null;try{const r=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),2500))]);sess=r?.data?.session||null}catch{}if(!sess){const saved=findStoredSession();if(saved){const r=await sb.auth.setSession({access_token:saved.access_token,refresh_token:saved.refresh_token});sess=r.data?.session||null}}if(!sess){$('gate').innerHTML='No pude recuperar tu sesión. <button onclick="location.href=\'/\'">Volver e ingresar de nuevo</button>';return}const r=await sb.from('profiles').select('id,role,active').eq('id',sess.user.id).single();if(r.error)throw r.error;if(!['manager','employee'].includes(r.data?.role)||!r.data?.active){$('gate').textContent='No tenés permiso para acceder a Rendimientos.';return}me=r.data;$('gate').classList.add('hide');$('app').classList.remove('hide');load()}catch(e){$('gate').textContent='No pude abrir Rendimientos: '+(e.message||e)}}
const localDate=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/San_Juan'});const localTime=()=>new Date().toLocaleTimeString('es-AR',{timeZone:'America/Argentina/San_Juan',hour:'2-digit',minute:'2-digit',hour12:false});const timeLabel=(stamp)=>{if(!stamp)return '';const d=new Date(stamp);if(Number.isNaN(d.getTime()))return '';if(d.getUTCHours()===12&&d.getUTCMinutes()===0&&d.getUTCSeconds()===0)return '';return d.toLocaleTimeString('es-AR',{timeZone:'America/Argentina/San_Juan',hour:'2-digit',minute:'2-digit',hour12:false})};const localStamp=(day,time)=>new Date(day+'T'+time+':00-03:00').toISOString();
async function load(){const r=await sb.from('consumable_yield_tracking').select('*').order('opened_on',{ascending:false});if(r.error){$('work').innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}$('work').innerHTML='<div class="card"><h2>Seguimientos</h2>'+(!r.data.length?'<p class="muted">Todavía no hay productos en seguimiento.</p>':r.data.map(x=>`<div class="item"><b>${esc(x.product_name)} #${x.unit_number}</b> <span class="${x.closed_on?'closed':'open'}">${x.closed_on?'FINALIZADO':'EN SEGUIMIENTO'}</span><div class="muted">Abierto: ${x.opened_on}${timeLabel(x.opened_at)?' a las '+timeLabel(x.opened_at):''}${x.closed_on?' · Terminado: '+x.closed_on+(timeLabel(x.closed_at)?' a las '+timeLabel(x.closed_at):'')+' · Duró '+days(x.opened_on,x.closed_on)+' días':''}</div>${x.notes?.trim()?`<div style="margin-top:10px;padding:11px 12px;background:#f2f9fc;border-radius:10px"><b>📝 Notas</b><div style="margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.notes)}</div></div>`:''}${!x.closed_on?`<button class="green" onclick="finish('${x.id}','${x.opened_on}')">Cerrar insumo terminado</button>`:''}</div>`).join(''))+'</div>'}
function showNew(){$('work').innerHTML=`<div class="card"><h2>Abrir nuevo insumo</h2><label>Producto</label><input id="pn" placeholder="Ej: Café, azúcar, edulcorantes"><div class="row"><div><label>Número</label><input id="num" type="number" min="1"></div><div><label>Fecha de apertura</label><input id="op" type="date"><label>Hora de apertura</label><input id="opTime" type="time"></div></div><label>Nota opcional</label><textarea id="note"></textarea><button onclick="saveNew()">Guardar seguimiento</button><button class="sec" onclick="load()">Cancelar</button></div>`;$('op').value=localDate();$('opTime').value=localTime()}async function saveNew(){const product_name=$('pn').value.trim(),unit_number=Number($('num').value),opened_on=$('op').value,opened_time=$('opTime').value,notes=$('note').value.trim()||null;if(!product_name||!Number.isInteger(unit_number)||unit_number<1||!opened_on||!opened_time){alert('Completá producto, número, fecha y hora.');return}const r=await sb.from('consumable_yield_tracking').insert({product_name,unit_number,opened_on,opened_at:localStamp(opened_on,opened_time),notes,created_by:me.id});if(r.error)return alert(r.error.message);load()}async function finish(id,opened){const closed_on=prompt('Fecha en que se terminó (AAAA-MM-DD)',localDate());if(!closed_on)return;const closed_time=prompt('Hora en que se terminó (HH:MM)',localTime());if(!closed_time)return;if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(closed_time))return alert('Ingresá una hora válida, por ejemplo 14:30.');if(closed_on<opened)return alert('La fecha no puede ser anterior.');const r=await sb.from('consumable_yield_tracking').update({closed_on,closed_at:localStamp(closed_on,closed_time),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);load()}init();</script></body></html>
