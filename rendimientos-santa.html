<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rendimientos · YPF SANTA TERESITA FULL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:#fff;padding:25px 18px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.green{background:#16875d}input,textarea{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:14px 0;border-bottom:1px solid #edf5f9}.muted{font-size:13px;color:#6c8794}.open{background:#fff7e7;padding:4px 9px;border-radius:20px;color:#9a6810;font-size:12px}.closed{background:#edf9f3;padding:4px 9px;border-radius:20px;color:#16875d;font-size:12px}.hide{display:none}@media print{button,.noPrint,.top{display:none!important}.card{box-shadow:none}}</style></head><body><div class="top"><div class="wrap"><span class="badge">ADMINISTRACIÓN</span><h2 style="margin:8px 0 0">📦 Rendimientos</h2><div style="opacity:.9;font-size:13px">Cuánto dura cada caja, envase o insumo</div></div></div><div class="wrap"><div id="gate" class="card">Comprobando acceso…</div><div id="app" class="hide"><div class="card noPrint"><button onclick="showNew()">+ Crear seguimiento</button><button class="sec" onclick="showMonthly()">📊 Resumen mensual</button><button class="sec" onclick="location.href='/'">Volver</button></div><div id="work"></div></div></div><script>const URL='https://sblkngrblimfhhkqilop.supabase.co',KEY='sb_publishable_CipXByoTnXEwjcYMXN3Btg_zyI104nD';const sb=supabase.createClient(URL,KEY);let me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const days=(a,b)=>Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1;async function init(){try{let user=null;const u=await sb.auth.getUser();user=u.data?.user||null;if(!user){const s=await sb.auth.getSession();user=s.data?.session?.user||null}if(!user){gate.innerHTML='No pude recuperar tu sesión. Volvé a Administración y abrí Rendimientos nuevamente.';return}const r=await sb.from('profiles').select('id,role,active').eq('id',user.id).single();if(r.error){gate.innerHTML='No pude comprobar tu perfil. '+esc(r.error.message);return}if(r.data?.role!=='manager'||!r.data?.active){gate.innerHTML='Esta sección es solo para Administración.';return}me=r.data;gate.classList.add('hide');app.classList.remove('hide');await load()}catch(e){gate.innerHTML='No se pudo comprobar el acceso. '+esc(e.message||e)}}async function load(){const r=await sb.from('consumable_yield_tracking').select('*').order('opened_on',{ascending:false});if(r.error){work.innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}work.innerHTML='<div class="card"><h2>Seguimientos</h2>'+(!r.data.length?'<p class="muted">Todavía no hay productos en seguimiento.</p>':r.data.map(x=>`<div class="item"><b>${esc(x.product_name)} #${x.unit_number}</b> <span class="${x.closed_on?'closed':'open'}">${x.closed_on?'FINALIZADO':'EN SEGUIMIENTO'}</span><div class="muted">Abierto: ${x.opened_on}${x.closed_on?' · Terminado: '+x.closed_on+' · <b>Duró '+days(x.opened_on,x.closed_on)+' días</b>':''}</div>${x.notes?'<div class="muted">'+esc(x.notes)+'</div>':''}${!x.closed_on?`<button class="green" onclick="finish('${x.id}','${x.opened_on}')">Finalizar producto</button>`:''}</div>`).join(''))+'</div>'}function showNew(){work.innerHTML=`<div class="card"><h2>Nuevo seguimiento</h2><label>Producto</label><input id="pn" placeholder="Ej: Caja de azúcar"><div class="row"><div><label>Número</label><input id="num" type="number" min="1" placeholder="23"></div><div><label>Fecha de apertura</label><input id="op" type="date"></div></div><label>Nota opcional</label><textarea id="note" placeholder="Marca, tamaño, observación..."></textarea><button onclick="saveNew()">Guardar seguimiento</button><button class="sec" onclick="load()">Cancelar</button></div>`;op.value=new Date().toISOString().slice(0,10)}async function saveNew(){const product_name=pn.value.trim(),unit_number=Number(num.value),opened_on=op.value,notes=note.value.trim()||null;if(!product_name||!Number.isInteger(unit_number)||unit_number<1||!opened_on){alert('Completá producto, número y fecha.');return}const r=await sb.from('consumable_yield_tracking').insert({product_name,unit_number,opened_on,notes,created_by:me.id});if(r.error){alert(r.error.message);return}alert('Seguimiento creado ✓');load()}async function finish(id,opened){const closed_on=prompt('Fecha en que se terminó (AAAA-MM-DD)',new Date().toISOString().slice(0,10));if(!closed_on)return;if(closed_on<opened){alert('La fecha de finalización no puede ser anterior a la apertura.');return}const r=await sb.from('consumable_yield_tracking').update({closed_on,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert(r.error.message);return}alert('Producto finalizado · duró '+days(opened,closed_on)+' días ✓');load()}async function showMonthly(){const month=prompt('Mes a consultar (AAAA-MM)',new Date().toISOString().slice(0,7));if(!month)return;const first=month+'-01',n=new Date(first+'T12:00:00');n.setMonth(n.getMonth()+1);const next=n.toISOString().slice(0,10);const r=await sb.from('consumable_yield_tracking').select('*').lt('opened_on',next).or('closed_on.gte.'+first+',closed_on.is.null').order('product_name');if(r.error){alert(r.error.message);return}const ended=r.data.filter(x=>x.closed_on&&x.closed_on>=first&&x.closed_on<next),open=r.data.filter(x=>!x.closed_on);const counts={};ended.forEach(x=>counts[x.product_name]=(counts[x.product_name]||0)+1);work.innerHTML=`<div class="card"><span class="badge">RESUMEN MENSUAL</span><h2>Rendimientos · ${month}</h2><h3>Productos terminados este mes</h3>${ended.length?Object.entries(counts).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><span style="float:right">${v} unidad${v===1?'':'es'}</span></div>`).join(''):'<p class="muted">No se finalizó ningún seguimiento este mes.</p>'}<h3>Detalle finalizados</h3>${ended.map(x=>`<div class="item"><b>${esc(x.product_name)} #${x.unit_number}</b><div class="muted">${x.opened_on} → ${x.closed_on} · <b>${days(x.opened_on,x.closed_on)} días</b></div></div>`).join('')||'<p class="muted">Sin datos.</p>'}<h3>Todavía en seguimiento</h3>${open.map(x=>`<div class="item"><b>${esc(x.product_name)} #${x.unit_number}</b><div class="muted">Abierto desde ${x.opened_on}</div></div>`).join('')||'<p class="muted">Ninguno.</p>'}<button class="green noPrint" onclick="window.print()">Imprimir / Guardar PDF</button><button class="sec noPrint" onclick="load()">Volver</button></div>`}init();</script></body></html>
