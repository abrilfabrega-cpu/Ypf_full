<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de cigarrillos · Tres Soles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,Arial;background:#f3faff;color:#193c50;margin:0;padding:16px}main{max-width:950px;margin:auto}.card{background:white;border:1px solid #d9edf6;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 3px 12px #0a446010}h1{font-size:23px;margin:8px 0}h2{font-size:18px}button{border:0;border-radius:10px;background:#2089bc;color:white;padding:10px 14px;font-weight:650;cursor:pointer;margin:4px 3px 4px 0}button.alt{background:#e7f4fa;color:#17628a}button.danger{background:#a43f3f}button:disabled{opacity:.45}input,textarea{font:inherit;padding:9px;border:1px solid #bfd6e1;border-radius:9px;max-width:100%;width:100%}input[type=number]{min-width:66px}.muted{color:#617e8c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{border:1px solid #e0edf4;border-radius:12px;padding:12px;margin:9px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-size:12px;color:#526c7b;margin:5px 0}.money{font-size:21px;font-weight:750}.warn{background:#fff0e8;padding:12px;border-radius:10px;color:#963e21}.ok{background:#e5f8ed;padding:12px;border-radius:10px;color:#246f46}.hidden{display:none}.mini{font-size:12px}table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid #e1edf3}td input{width:100%}@media(max-width:600px){body{padding:9px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.grid input{padding:8px 5px}}</style></head><body><main><div class="card"><button class="alt" onclick="location.href='/'">← Volver a YPF</button><h1>🚬 Control de cigarrillos</h1><div class="muted">YPF Tres Soles · cantidades por turno y diferencia de caja</div><div id="status">Comprobando acceso…</div></div><div id="work"></div></main><script>
const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString('es-AR'),valid=v=>v!==''&&v!==null&&v!==undefined&&Number.isInteger(Number(v))&&Number(v)>=0;
let me=null,shift=null,catalog=[],counts={},cash=null,previous={},editing=false;
async function query(table){const r=await sb.from(table).select('*');if(r.error)throw r.error;return r.data||[]}
async function start(){try{const u=(await sb.auth.getUser()).data.user;if(!u){$('status').textContent='Iniciá sesión en la aplicación de YPF y volvé a abrir esta sección.';return}const p=await sb.from('profiles').select('*').eq('id',u.id).single();if(p.error||!p.data?.active)throw Error('Usuario sin acceso');me=p.data;const c=await sb.from('cigarette_catalog').select('*').order('sort_order');if(c.error)throw c.error;catalog=c.data||[];$('status').textContent='Sesión: '+me.full_name+' · '+(me.role==='manager'?'Administración':'Empleada');if(me.role==='manager')return admin();const sh=await sb.from('shifts').select('*').eq('employee_id',me.id).eq('status','open').order('opened_at',{ascending:false}).limit(1);if(sh.error)throw sh.error;shift=sh.data?.[0];if(!shift){$('work').innerHTML='<div class="card"><h2>No hay turno abierto</h2><p>Abrí tu turno desde la aplicación principal y después entrá a Cigarrillos.</p></div>';return}await employee()}catch(e){$('status').textContent='Error: '+e.message}}
async function employee(){const r=await sb.from('cigarette_counts').select('*').eq('shift_id',shift.id);if(r.error)throw r.error;counts=Object.fromEntries((r.data||[]).map(x=>[x.cigarette_id,x]));const m=await sb.from('cigarette_shift_cash').select('*').eq('shift_id',shift.id).maybeSingle();cash=m.data;const p=await sb.from('shifts').select('id,opened_at,closed_at').eq('status','closed').lt('opened_at',shift.opened_at).order('opened_at',{ascending:false}).limit(1);if(p.data?.[0]){const z=await sb.from('cigarette_counts').select('*').eq('shift_id',p.data[0].id);previous=Object.fromEntries((z.data||[]).map(x=>[x.cigarette_id,x.remaining]));}
$('work').innerHTML='<div class="card"><h2>Mi conteo de cigarrillos</h2><p class="muted">Escribí las cantidades directamente. Recibe = conteo inicial; ingresa = mercadería recibida durante el turno; queda = conteo al cerrar.</p><div id="alerts"></div><div id="items"></div><button onclick="saveAll()">Guardar conteo</button></div><div class="card"><h2>💰 Diferencia de cigarrillos</h2><div id="totals"></div><label>Plata real que quedó ($)</label><input id="actual" type="number" min="0" step="1" value="'+(cash?.actual_amount??'')+'" placeholder="Escribí la plata real"><label>Observaciones</label><textarea id="cashnote">'+esc(cash?.notes||'')+'</textarea><button onclick="saveAll()">Guardar conteo y dinero real</button><p class="muted">Para registrar el cierre, completá todas las cantidades y el dinero real.</p></div>';
$('items').innerHTML=catalog.filter(x=>x.active||counts[x.id]).map(x=>{const v=counts[x.id]||{};return '<div class="item" data-cig="'+x.id+'"><b>'+esc(x.name)+'</b> <span class="muted">Código '+esc(x.code||'sin código')+' · Diferencia $'+fmt(v.difference_snapshot||x.difference)+'</span><div class="grid"><div><label>Recibe</label><input class="rec" type="number" min="0" step="1" value="'+(v.received??'')+'"></div><div><label>Ingresa</label><input class="inc" type="number" min="0" step="1" value="'+(v.incoming??0)+'"></div><div><label>Queda</label><input class="rem" type="number" min="0" step="1" value="'+(v.remaining??'')+'"></div></div><div class="mini calc"></div></div>'}).join('');
document.querySelectorAll('#items input,#actual').forEach(e=>e.addEventListener('input',recalc));recalc();}
function recalc(){let total=0,missing=0,alerts=[];document.querySelectorAll('[data-cig]').forEach(el=>{const x=catalog.find(p=>p.id===el.dataset.cig),v=counts[x.id]||{},a=el.querySelector('.rec').value,b=el.querySelector('.inc').value,c=el.querySelector('.rem').value;const prev=previous[x.id];if(prev!==null&&prev!==undefined&&valid(a)&&Number(prev)!==Number(a))alerts.push(esc(x.name)+': turno anterior '+prev+' · recibe '+a+' (diferencia '+(Number(a)-Number(prev))+')');if(!valid(a)||!valid(b)||!valid(c)){missing++;el.querySelector('.calc').textContent='Completá el conteo';return}const sold=Number(a)+Number(b)-Number(c),diff=Number(v.difference_snapshot||x.difference);el.querySelector('.calc').textContent=sold<0?'⚠ Conteo inconsistente':'Vendidos: '+sold+' · Diferencia: $'+fmt(sold*diff);if(sold<0)missing++;else total+=sold*diff});const actual=$('actual').value;$('totals').innerHTML='<div class="money">Esperado: $'+fmt(total)+'</div><div class="money">Real: '+(actual===''?'Sin cargar':'$'+fmt(actual))+'</div><div class="'+(actual!==''&&Number(actual)===total?'ok':'warn')+'">'+(actual===''?'Ingresá la plata real':Number(actual)===total?'✓ Coincide':Number(actual)<total?'Faltan $'+fmt(total-Number(actual)):'Sobran $'+fmt(Number(actual)-total))+'</div>'+(missing?'<p class="warn">Faltan o son inválidos '+missing+' conteos.</p>':'');$('alerts').innerHTML=alerts.length?'<div class="warn"><b>⚠ Diferencias con el turno anterior</b><ul>'+alerts.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>':'';return {total,missing}}
async function saveAll(){if(editing)return;const t=recalc();if(t.missing)return alert('Completá todos los conteos con números válidos antes de guardar.');if(!valid($('actual').value))return alert('Completá el dinero real de cigarrillos.');editing=true;try{const rows=[...document.querySelectorAll('[data-cig]')].map(el=>{const x=catalog.find(p=>p.id===el.dataset.cig);return {shift_id:shift.id,cigarette_id:x.id,received:Number(el.querySelector('.rec').value),incoming:Number(el.querySelector('.inc').value),remaining:Number(el.querySelector('.rem').value),difference_snapshot:Number(counts[x.id]?.difference_snapshot??x.difference),updated_by:me.id,updated_at:new Date().toISOString()}});const a=await sb.from('cigarette_counts').upsert(rows,{onConflict:'shift_id,cigarette_id'});if(a.error)throw a.error;const b=await sb.from('cigarette_shift_cash').upsert({shift_id:shift.id,actual_amount:Number($('actual').value),notes:$('cashnote').value,updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:'shift_id'});if(b.error)throw b.error;alert('Conteo y diferencia guardados ✓');await employee()}catch(e){alert('No se pudo guardar: '+e.message)}finally{editing=false}}
async function admin(){const all=await sb.from('shifts').select('id,kind,status,opened_at,closed_at,employee_id').order('opened_at',{ascending:false}).limit(30);const cashR=await sb.from('cigarette_shift_cash').select('*').in('shift_id',(all.data||[]).map(x=>x.id).length?(all.data||[]).map(x=>x.id):['00000000-0000-0000-0000-000000000000']);const rows=await sb.from('cigarette_counts').select('*').in('shift_id',(all.data||[]).map(x=>x.id).length?(all.data||[]).map(x=>x.id):['00000000-0000-0000-0000-000000000000']);const users=await sb.from('profiles').select('id,full_name');let totals={};(rows.data||[]).forEach(x=>{if(x.received===null||x.remaining===null)return;const v=x.received+x.incoming-x.remaining;totals[x.shift_id]=(totals[x.shift_id]||0)+v*Number(x.difference_snapshot)});$('work').innerHTML='<div class="card"><h2>⚙️ Catálogo editable</h2><p class="muted">Podés cambiar nombre, código, precio, diferencia, activar/desactivar y agregar variedades. No podés editar las cantidades de stock de las empleadas.</p><button onclick="addCig()">+ Agregar cigarrillo</button><div id="catalog"></div></div><div class="card"><h2>📋 Últimos turnos</h2><div id="history"></div></div>'; $('catalog').innerHTML=catalog.map(x=>'<div class="item" data-edit="'+x.id+'"><div class="row"><div><label>Nombre</label><input class="name" value="'+esc(x.name)+'"></div><div><label>Código</label><input class="code" value="'+esc(x.code||'')+'"></div></div><div class="row"><div><label>Precio ($)</label><input class="price" type="number" min="0" value="'+(x.price??'')+'"></div><div><label>Diferencia ($)</label><input class="diff" type="number" min="0" value="'+x.difference+'"></div></div><button onclick="saveCig(\''+x.id+'\')">Guardar cambios</button><button class="alt" onclick="toggleCig(\''+x.id+'\','+!x.active+')">'+(x.active?'Desactivar':'Reactivar')+'</button></div>').join('');$('history').innerHTML=(all.data||[]).map(s=>{const actual=(cashR.data||[]).find(x=>x.shift_id===s.id)?.actual_amount,expected=totals[s.id],name=(users.data||[]).find(x=>x.id===s.employee_id)?.full_name||'Empleada';return '<div class="item"><b>'+esc(name)+'</b> · '+new Date(s.opened_at).toLocaleString('es-AR')+' · '+esc(s.kind)+' · '+esc(s.status)+'<div>Esperado: '+(expected===undefined?'Sin cargar':'$'+fmt(expected))+' · Real: '+(actual===null||actual===undefined?'Sin cargar':'$'+fmt(actual))+'</div>'+(expected!==undefined&&actual!==null&&actual!==undefined?'<b>Desvío: $'+fmt(Number(actual)-expected)+'</b>':'')+'</div>'}).join('')||'Sin turnos';}
async function saveCig(id){const e=document.querySelector('[data-edit="'+id+'"]'),x=catalog.find(c=>c.id===id);const name=e.querySelector('.name').value.trim(),code=e.querySelector('.code').value.trim()||null,price=e.querySelector('.price').value,difference=e.querySelector('.diff').value;if(!name||!valid(difference))return alert('Completá nombre y diferencia válida.');const r=await sb.from('cigarette_catalog').update({name,code,price:price===''?null:Number(price),difference:Number(difference),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);alert('Cambios guardados');start()}
async function toggleCig(id,active){const r=await sb.from('cigarette_catalog').update({active}).eq('id',id);if(r.error)return alert(r.error.message);start()}
async function addCig(){const name=prompt('Nombre del cigarrillo');if(!name?.trim())return;const code=prompt('Código (podés dejarlo vacío)')||null;const difference=prompt('Diferencia por unidad ($)','0');if(!valid(difference))return alert('Diferencia inválida');const r=await sb.from('cigarette_catalog').insert({name:name.trim(),code,difference:Number(difference),sort_order:catalog.length+1});if(r.error)return alert(r.error.message);start()}
start();
</script></body></html>
