<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#62bde9"><title>Vencimientos · YPF Tres Soles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.wrap{max-width:720px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#1979a8;box-shadow:0 3px 14px #16384b18}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 7px 24px #16384b16;margin-bottom:12px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{font-size:13px;color:#688391}.alert{background:#fff4dd;border:1px solid #ffd992;border-radius:14px;padding:11px;margin-bottom:12px;font-size:13px}.grid{display:grid;grid-template-columns:1.5fr .65fr 1fr;gap:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}input{width:100%;border:1px solid #cfe7f3;border-radius:11px;padding:10px;font-size:14px;background:#fbfeff}button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;background:#1979a8;color:#fff}.save{width:100%;margin-top:8px}.lots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.lot{border:1px solid #dceef6;border-radius:13px;padding:10px;background:#fbfeff;min-width:0}.lot.warn{border-color:#f4c25f;background:#fff9ed}.lot.expired{border-color:#efaaaa;background:#fff1f1}.name{font-weight:850;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#66818e;margin-top:4px;line-height:1.35}.status{font-size:11px;font-weight:850;margin-top:6px}.actions{display:flex;gap:5px;margin-top:7px}.actions button{padding:6px 8px;font-size:11px;flex:1}.danger{background:#c84a4a}.empty{text-align:center;color:#78909c;font-size:13px;padding:18px}@media(max-width:480px){.lots{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr .65fr}.grid input[type=date]{grid-column:1/3}.grid2{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='/'">← Volver</button><h1>📅 Vencimientos</h1></div><div id="notice"></div><div class="card"><h2>Agregar lote</h2><div class="grid"><input id="name" placeholder="Producto"><input id="qty" type="number" min="0" step="1" placeholder="Cant."><input id="date" type="date"></div><div class="grid2" style="margin-top:7px"><input id="lot" placeholder="Lote (opcional)"><input id="note" placeholder="Nota (opcional)"></div><button class="save" onclick="addLot()">+ Agregar producto</button></div><div class="card"><h2>Productos cargados</h2><div id="lots" class="lots"></div></div></div><script>const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function days(iso){const a=new Date();a.setHours(0,0,0,0);const b=new Date(iso+'T00:00:00');return Math.ceil((b-a)/86400000)}function fmtDate(x){return new Date(x+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'})}async function ensureManager(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='/';return false}const r=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(r.error||r.data?.role!=='manager'){alert('Esta sección es solo para administración.');location.href='/';return false}return true}async function load(){if(!await ensureManager())return;const r=await sb.from('product_expiry_lots').select('*').eq('active',true).order('expires_on',{ascending:true});if(r.error){document.getElementById('lots').innerHTML='<div class="empty">No se pudieron cargar los vencimientos.</div>';return}const soon=r.data.filter(x=>days(x.expires_on)>=0&&days(x.expires_on)<=14),expired=r.data.filter(x=>days(x.expires_on)<0);document.getElementById('notice').innerHTML=soon.length||expired.length?'<div class="alert"><b>⚠️ Atención:</b> '+(soon.length?soon.length+' producto'+(soon.length===1?'':'s')+' vence'+(soon.length===1?'':'n')+' dentro de 14 días. ':'')+(expired.length?expired.length+' lote'+(expired.length===1?' está':'s están')+' vencido'+(expired.length===1?'':'s')+'.':'')+'</div>':'';document.getElementById('lots').innerHTML=r.data.length?r.data.map(x=>{const d=days(x.expires_on),cls=d<0?'expired':d<=14?'warn':'',st=d<0?'VENCIDO':d===0?'Vence hoy':d<=14?'⚠️ Vence en '+d+' días':'Vence en '+d+' días';return '<div class="lot '+cls+'"><div class="name">'+esc(x.product_name)+'</div><div class="meta">'+esc(x.quantity)+' u. · '+fmtDate(x.expires_on)+(x.lot_code?'<br>Lote: '+esc(x.lot_code):'')+'</div><div class="status">'+st+'</div><div class="actions"><button onclick="editQty(\''+x.id+'\','+Number(x.quantity)+')">Cantidad</button><button class="danger" onclick="removeLot(\''+x.id+'\')">Retirar</button></div></div>'}).join(''):'<div class="empty">Todavía no cargaste productos.</div>'}async function addLot(){const product_name=document.getElementById('name').value.trim(),quantity=Number(document.getElementById('qty').value),expires_on=document.getElementById('date').value,lot_code=document.getElementById('lot').value.trim()||null,note=document.getElementById('note').value.trim()||null;if(!product_name||!expires_on||!Number.isFinite(quantity)||quantity<=0){alert('Completá producto, cantidad y fecha de vencimiento.');return}const {data:{user}}=await sb.auth.getUser();const r=await sb.from('product_expiry_lots').insert({product_name,quantity,expires_on,lot_code,note,created_by:user.id});if(r.error){alert('No se pudo guardar: '+r.error.message);return}['name','qty','date','lot','note'].forEach(id=>document.getElementById(id).value='');load()}async function editQty(id,current){const v=prompt('Cantidad actual del lote:',current);if(v===null)return;const quantity=Number(v);if(!Number.isFinite(quantity)||quantity<0){alert('Cantidad inválida.');return}const r=await sb.from('product_expiry_lots').update({quantity,updated_at:new Date().toISOString(),active:quantity>0}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function removeLot(id){if(!confirm('¿Retirar este lote de Vencimientos?'))return;const r=await sb.from('product_expiry_lots').update({active:false,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}load();</script></body></html>
