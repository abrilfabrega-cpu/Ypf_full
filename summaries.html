async function fetchAll(table,cols,from,to,column='created_at'){
 let all=[];for(let offset=0;offset<5000;offset+=1000){
  let q=sb.from(table).select(cols).gte(column,from).lt(column,to).order(column,{ascending:true}).range(offset,offset+999);
  const r=await q;if(r.error)throw new Error(table+': '+r.error.message);

 }return all;
}
