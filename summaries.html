<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Resúmenes · YPF Tres Soles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3faff;color:#16384b}.top{background:linear-gradient(135deg,#49afe1,#86d3f4);color:white;padding:26px 20px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:20px;margin:13px 0;box-shadow:0 5px 22px #267ca51a}.badge{display:inline-block;background:#e4f5fd;color:#1979a8;padding:5px 10px;border-radius:20px;font-size:12px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#43afe2;color:#fff;font-size:16px;font-weight:700;margin:5px 0}.sec{background:#e7f6fd;color:#1979a8}.ghost{background:#f7fcff;color:#1979a8;border:1px solid #c9eafa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f7fcff;border:1px solid #d7effa;border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}.muted,.tiny{font-size:13px;color:#6c8794}.item{padding:10px 0;border-bottom:1px solid #edf5f9}input{width:100%;padding:13px;border:1px solid #cce8f5;border-radius:12px;margin:5px 0 10px;font-size:16px}.rating{padding:12px;border-radius:14px;font-weight:800;margin:10px 0;background:#fff7e7;color:#9a6810}@media print{button,.noPrint,.top{display:none!important}.card{box-shadow:none}}</style></head><body><header class="top"><b>YPF TRES SOLES FULL</b><div>Resúmenes del negocio</div></header><main class="wrap" id="work"><div class="card">Cargando…</div></main><script>const sb=supabase.createClient('https://eodbrfdzaizopiihuryz.supabase.co','sb_publishable_DxkNoyp7w7QWM-CjnwP0lA_68CUUfpo');const w=document.getElementById('work');const fmt=n=>Number(n||0).toLocaleString('es-AR');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function mondayOf(date){const x=new Date(date);x.setHours(12,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}function addDays(iso,n){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}function pretty(iso){return new Date(iso+'T12:00:00').toLocaleDateString('es-AR')}function rows(a){return(a||[]).length?a.map(x=>`<div class="item"><b>${esc(x.product)}</b><span style="float:right">${fmt(x.quantity)}</span></div>`).join(''):'<p class="muted">Sin movimientos.</p>'}async function loadWeek(week){const r=await sb.rpc('business_week_summary',{p_week_start:week});if(r.error)throw r.error;return r.data}async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u){w.innerHTML='<div class="card"><h2>Iniciá sesión en la app primero</h2><button onclick="location.href=\'/\'">Volver a la app</button></div>';return}const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='manager'){w.innerHTML='<div class="card"><h2>Solo administración</h2><button onclick="location.href=\'/\'">Volver</button></div>';return}home()}function home(){const week=mondayOf(new Date());w.innerHTML=`<div class="card"><span class="badge">ADMINISTRACIÓN</span><h2>📊 Resúmenes</h2><p class="muted">Octubre: modo prueba · Desde noviembre: informes oficiales.</p><button onclick="weekly('${week}')">Resumen semanal</button><button class="sec" onclick="monthly()">Resumen mensual</button><button class="ghost" onclick="location.href='/'">Volver a la app</button></div>`}async function weekly(week){try{const x=await loadWeek(week);w.innerHTML=`<div class="card"><span class="badge">RESUMEN SEMANAL</span><h2>${pretty(x.week_start)} al ${pretty(x.week_end)}</h2><div class="grid"><div class="stat"><span class="tiny">Leches utilizadas</span><b>${fmt(x.milk_used)}</b></div><div class="stat"><span class="tiny">Cafés informados</span><b>${fmt(x.coffee_sold)}</b></div><div class="stat"><span class="tiny">No facturados</span><b>${fmt(x.unbilled_quantity)}</b><span class="tiny">$ ${fmt(x.unbilled_value)}</span></div><div class="stat"><span class="tiny">Sobrante de caja</span><b>$ ${fmt(x.cash_surplus)}</b></div></div><div class="rating">☕ ${esc(x.coffee_rating)}${x.coffee_per_milk?' · '+fmt(x.coffee_per_milk)+' cafés por leche':''}</div><label>Cafés estimados vendidos esta semana</label><input id="coffee" type="number" min="0" step="1" value="${Number(x.coffee_sold||0)}"><button onclick="saveCoffee('${week}')">Guardar cafés y recalcular</button><h3>Productos utilizados / vendidos</h3>${rows(x.products_used)}<h3>Compras de la semana</h3>${rows(x.purchases)}<button class="noPrint" onclick="window.print()">Imprimir / Guardar PDF</button><div class="grid noPrint"><button class="sec" onclick="weekly('${addDays(week,-7)}')">← Anterior</button><button class="sec" onclick="weekly('${addDays(week,7)}')">Siguiente →</button></div><button class="ghost noPrint" onclick="home()">Volver</button></div>`}catch(e){alert('No se pudo cargar: '+e.message)}}async function saveCoffee(week){const n=Number(document.getElementById('coffee').value);if(!Number.isInteger(n)||n<0)return alert('Ingresá una cantidad válida.');const r=await sb.rpc('save_weekly_coffee',{p_week_start:week,p_coffee:n});if(r.error)return alert(r.error.message);weekly(week)}async function monthly(){const now=new Date(),month=prompt('Mes a consultar (AAAA-MM)',now.toISOString().slice(0,7));if(!month)return;if(!/^\d{4}-\d{2}$/.test(month))return alert('Usá formato AAAA-MM');const first=month+'-01',next=new Date(first+'T12:00:00');next.setMonth(next.getMonth()+1);const last=new Date(next);last.setDate(last.getDate()-1);let wk=mondayOf(first),weeks=[];while(new Date(wk+'T12:00:00')<=last){weeks.push(wk);wk=addDays(wk,7)}try{const data=await Promise.all(weeks.map(loadWeek));let milk=0,coffee=0,unb=0,cash=0;data.forEach(x=>{milk+=Number(x.milk_used||0);coffee+=Number(x.coffee_sold||0);unb+=Number(x.unbilled_value||0);cash+=Number(x.cash_surplus||0)});w.innerHTML=`<div class="card"><span class="badge">RESUMEN MENSUAL</span><h2>${new Date(first+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</h2><div class="grid"><div class="stat"><span class="tiny">Leches</span><b>${fmt(milk)}</b></div><div class="stat"><span class="tiny">Cafés</span><b>${fmt(coffee)}</b></div><div class="stat"><span class="tiny">No facturado</span><b>$ ${fmt(unb)}</b></div><div class="stat"><span class="tiny">Sobrante</span><b>$ ${fmt(cash)}</b></div></div>${data.map((x,i)=>`<div class="item"><h3>Semana ${i+1} · ${pretty(x.week_start)} al ${pretty(x.week_end)}</h3><div class="tiny">Leches ${fmt(x.milk_used)} · Cafés ${fmt(x.coffee_sold)} · ${esc(x.coffee_rating)}</div><h3>Usado / vendido</h3>${rows(x.products_used)}<h3>Compras</h3>${rows(x.purchases)}</div>`).join('')}<button class="noPrint" onclick="window.print()">Imprimir / Guardar PDF mensual</button><button class="ghost noPrint" onclick="home()">Volver</button></div>`}catch(e){alert('No se pudo generar: '+e.message)}}boot();</script></body></html>
