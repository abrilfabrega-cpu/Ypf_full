<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YPF TRES SOLES FULL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#app{border:0;width:100%;height:100%}#summaries{display:none;position:fixed;right:16px;bottom:18px;z-index:999999;border:0;border-radius:16px;padding:14px 18px;background:#1979a8;color:white;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial;box-shadow:0 8px 28px #16384b55}</style></head><body><iframe id="app" src="/index.html"></iframe><button id="summaries">📊 Resúmenes</button><script>const f=document.getElementById('app'),b=document.getElementById('summaries');function check(){try{const outer=f.contentDocument;if(!outer)return;const inner=outer.getElementById('app');const d=inner&&inner.contentDocument;if(!d)return;const badge=[...d.querySelectorAll('.badge')].find(x=>x.textContent.trim()==='ADMINISTRACIÓN');b.style.display=badge?'block':'none'}catch(e){b.style.display='none'}}setInterval(check,500);b.onclick=()=>location.href='/summaries.html';</script></body></html>
